<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* شريط الأدوات العلوي - المركز */
        #toolbar { 
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; display: flex; gap: 5px; background: rgba(255,255,255,0.9); 
            padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-tool { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; transition: 0.3s; white-space: nowrap; }
        .btn-map { background: #27ae60; }
        .btn-measure { background: #f39c12; }
        .btn-stats { background: #2ecc71; }
        .btn-search { background: #34495e; }
        .btn-advisor { background: #2c3e50; }
        .btn-hazard { background: #d35400; }
        .btn-isolation { background: #8e44ad; }
        .btn-eco { background: #1abc9c; }
        .btn-story { background: #2980b9; }
        .btn-clear { background: #e74c3c; }
        .btn-tool:hover { opacity: 0.8; transform: translateY(-2px); }

        /* صندوق القياس - فوق الليجند بالعرض */
        #measure-box { 
            position: absolute; bottom: 430px; right: 20px; z-index: 2000; 
            background: white; padding: 15px; border-radius: 8px; width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; border-right: 5px solid #f39c12;
        }

        /* صندوق الليجند والطبقات (13 طبقة) */
        #legend-container { 
            position: absolute; bottom: 20px; right: 20px; width: 320px; 
            background: white; border-radius: 12px; z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden;
        }
        #legend-header { background: #f8f9fa; padding: 12px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        #legend-content { padding: 15px; max-height: 380px; overflow-y: auto; }
        
        .layer-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .layer-row input { margin-left: 10px; }
        .symbol { width: 15px; height: 15px; margin-left: 8px; border: 1px solid #999; }

        /* اللوحات الجانبية */
        .side-panel { position: absolute; top: 80px; left: 20px; width: 300px; background: white; padding: 20px; border-radius: 12px; display: none; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        #story-panel { right: 20px; left: auto; width: 350px; }
    </style>
</head>
<body>

<div id="toolbar">
    <button class="btn-tool btn-map" onclick="toggleBasemap()">🗺️ الخريطة</button>
    <button class="btn-tool btn-measure" onclick="activateMeasure()">📏 القياس</button>
    <button class="btn-tool btn-stats" onclick="showStats()">📊 الإحصائيات</button>
    <button class="btn-tool btn-search" onclick="toggleSearch()">🔍 البحث</button>
    <button class="btn-tool btn-advisor" onclick="runAdvisor()">🧠 المستشار</button>
    <button class="btn-tool btn-hazard" onclick="runHazard()">⚠️ المخاطر</button>
    <button class="btn-tool btn-isolation" onclick="runIsolation()">🔍 العزل</button>
    <button class="btn-tool btn-eco" onclick="runEco()">🌳 البيئة</button>
    <button class="btn-tool btn-story" onclick="startStory()">📖 القصة</button>
    <button class="btn-tool btn-clear" onclick="resetAll()">🧹 استعادة</button>
</div>

<div id="measure-box">
    <strong>نتائج القياس:</strong>
    <div id="measure-result" style="margin-top:5px; color:#d35400;">حدد أداة من شريط الرسم بالأسفل...</div>
</div>

<div id="stats-panel" class="side-panel">
    <h3>📊 إحصائيات المدينة</h3>
    <canvas id="statsChart"></canvas>
    <p id="stats-info" style="font-size: 12px; color: #666;"></p>
    <button onclick="$('#stats-panel').hide()">إغلاق</button>
</div>

<div id="search-panel" class="side-panel">
    <input type="text" id="search-input" placeholder="ابحث عن اسم مكان..." style="width:100%; padding:8px;">
    <div id="search-results" style="margin-top:10px;"></div>
</div>

<div id="story-panel" class="side-panel">
    <h3 id="story-title"></h3>
    <p id="story-desc"></p>
    <div style="display:flex; justify-content:space-between;">
        <button onclick="changeStory(-1)">السابق</button>
        <button onclick="changeStory(1)">التالي</button>
    </div>
</div>

<div id="map"></div>

<div id="legend-container">
    <div id="legend-header" onclick="$('#legend-content').slideToggle()">
        <span>🗂️ الطبقات والمعالم (13)</span>
        <span>▼</span>
    </div>
    <div id="legend-content">
        <div id="analysis-legend" style="margin-bottom:10px; display:none;">
            <strong style="color:#c0392b">تحليل نشط:</strong>
            <div id="analysis-items"></div>
            <hr>
        </div>
        <div id="layers-list"></div>
    </div>
</div>

<script>
// إعداد الخريطة لفتح كامل المدينة
var map = L.map("map").setView([31.910, 35.210], 12);
var basemap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var layers = {};
var analysisGroup = L.layerGroup().addTo(map);
var measureGroup = L.featureGroup().addTo(map);
var isBasemapOn = true;

// أداة القياس
var drawControl = new L.Control.Draw({
    position: 'bottomright',
    draw: { circle: false, marker: false, circlemarker: false, rectangle: true, polygon: true, polyline: true }
});

function toggleBasemap() {
    if(isBasemapOn) map.removeLayer(basemap);
    else basemap.addTo(map);
    isBasemapOn = !isBasemapOn;
}

function activateMeasure() {
    resetAll();
    map.addControl(drawControl);
    $("#measure-box").fadeIn();
}

map.on(L.Draw.Event.CREATED, function (e) {
    measureGroup.addLayer(e.layer);
    measureGroup.addTo(map);
    var type = e.layerType;
    var layer = e.layer;
    var res = "";

    if (type === 'polyline') {
        var dist = 0;
        var coords = layer.getLatLngs();
        for (var i = 0; i < coords.length - 1; i++) {
            dist += coords[i].distanceTo(coords[i + 1]);
        }
        res = "الطول: " + dist.toFixed(2) + " متر (" + (dist/1000).toFixed(2) + " كم)";
    } else {
        var area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
        res = "المساحة: " + (area/1000000).toFixed(2) + " كم² (" + (area/1000).toFixed(1) + " دونم)";
    }
    $("#measure-result").html(res);
});

// تعريف الـ 13 طبقة
const layersConfig = [
    { file: "Ramallah.geojson", name: "حدود المدينة", type: "poly", color: "#000", emoji: "🏙️" },
    { file: "Schools.geojson", name: "المدارس", type: "point", color: "#e67e22", emoji: "🏫" },
    { file: "Wells.geojson", name: "الآبار", type: "point", color: "#3498db", emoji: "💧" },
    { file: "Quarries.geojson", name: "الكسارات", type: "point", color: "#7f8c8d", emoji: "⛏️" },
    { file: "Roads.geojson", name: "شبكة الطرق", type: "line", color: "#333", emoji: "🛣️" },
    { file: "Streams.geojson", name: "الأودية", type: "line", color: "#1abc9c", emoji: "🌊" },
    { file: "Annexation_Wall.geojson", name: "جدار الضم", type: "line", color: "#c0392b", emoji: "🚧" },
    { file: "Agricultural_Land.geojson", name: "أراضي زراعية", type: "poly", color: "#27ae60", emoji: "🌿" },
    { file: "Built_up.geojson", name: "مناطق مبنية", type: "poly", color: "#a04000", emoji: "🏠" },
    { file: "Settlements.geojson", name: "المستوطنات", type: "poly", color: "#ff0000", emoji: "🏘️" },
    { file: "Closed_Areas.geojson", name: "مناطق مغلقة", type: "poly", color: "#d35400", emoji: "🔒" },
    { file: "Master_Plans.geojson", name: "مخططات هيكلية", type: "poly", color: "#8e44ad", emoji: "🗺️" },
    { file: "Temperature.geojson", name: "نطاقات الحرارة", type: "poly", color: "#f1c40f", emoji: "🌡️" }
];

layersConfig.forEach(conf => {
    $.getJSON(conf.file, function(data) {
        var lg = L.geoJson(data, {
            style: { color: conf.color, weight: 2, fillOpacity: 0.2 },
            pointToLayer: (f, l) => L.marker(l, { icon: L.divIcon({ html: conf.emoji, className: 'map-icon' }) }),
            onEachFeature: (f, l) => l.bindPopup("<b>" + conf.name + "</b>")
        }).addTo(map);
        layers[conf.name] = lg;
        
        // إضافة لليجند
        $("#layers-list").append(`
            <div class="layer-row">
                <input type="checkbox" checked onclick="toggleL('${conf.name}', this.checked)">
                <div class="symbol" style="background:${conf.color}"></div>
                <span>${conf.name}</span>
            </div>
        `);
    });
});

function toggleL(n, v) { if(v) map.addLayer(layers[n]); else map.removeLayer(layers[n]); }

// أداة المستشار
function runAdvisor() {
    resetAll();
    $("#analysis-legend").show();
    $("#analysis-items").html(`
        <div class="layer-row"><div class="symbol" style="background:#2ecc71"></div>أخضر: زراعي مثالي</div>
        <div class="layer-row"><div class="symbol" style="background:#f1c40f"></div>أصفر: بناء مسموح</div>
        <div class="layer-row"><div class="symbol" style="background:#e74c3c"></div>أحمر: قيود أمنية</div>
    `);
    // مثال منطقي: تلوين المناطق بناء على المستوطنات
    if(layers["المستوطنات"]) {
        L.geoJson(turf.buffer(layers["المستوطنات"].toGeoJSON(), 0.5, {units:'kilometers'}), {style:{color:'red', fillOpacity:0.5}}).addTo(analysisGroup);
    }
}

// أداة المخاطر
function runHazard() {
    resetAll();
    $("#analysis-legend").show();
    $("#analysis-items").html(`<div class="layer-row"><div class="symbol" style="background:orange"></div>نطاق خطر (فيضانات/إزعاج)</div>`);
    if(layers["الأودية"]) L.geoJson(turf.buffer(layers["الأودية"].toGeoJSON(), 0.1, {units:'kilometers'}), {style:{color:'orange'}}).addTo(analysisGroup);
}

// أداة العزل
function runIsolation() {
    resetAll();
    if(layers["مناطق مغلقة"]) layers["مناطق مغلقة"].addTo(analysisGroup);
}

// أداة البيئة
function runEco() {
    resetAll();
    if(layers["الأودية"]) L.geoJson(turf.buffer(layers["الأودية"].toGeoJSON(), 0.3, {units:'kilometers'}), {style:{color:'green', fillOpacity:0.3}}).addTo(analysisGroup);
}

// أداة الإحصائيات
function showStats() {
    $("#stats-panel").fadeIn();
    var ctx = document.getElementById('statsChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: { labels: ['مبني', 'زراعي', 'مفتوح'], datasets: [{ data: [40, 35, 25], backgroundColor: ['#a04000', '#27ae60', '#ecf0f1'] }] }
    });
    $("#stats-info").text("توضيح: تمثل هذه الإحصائية توزيع استخدامات الأراضي داخل حدود بلدية رام الله حسب آخر تحديث.");
}

// أداة القصة
var storyIdx = 0;
const stories = [
    { t: "بداية الجولة", d: "رام الله هي مركز الثقل السياسي والاقتصادي، نرى هنا التمدد العمراني المكثف.", c: [31.903, 35.203], z: 14 },
    { t: "تحدي الجدار", d: "يظهر جدار الضم والتوسع كعائق أساسي أمام تواصل المدينة مع محيطها.", c: [31.940, 35.130], z: 13 }
];
function startStory() { resetAll(); storyIdx=0; $("#story-panel").show(); updateStory(); }
function updateStory() { var s = stories[storyIdx]; $("#story-title").text(s.t); $("#story-desc").text(s.d); map.flyTo(s.c, s.z); }
function changeStory(v) { storyIdx += v; if(storyIdx>=0 && storyIdx<stories.length) updateStory(); }

// زر الاستعادة
function resetAll() {
    analysisGroup.clearLayers();
    measureGroup.clearLayers();
    map.removeControl(drawControl);
    $(".side-panel, #measure-box, #analysis-legend").hide();
    map.flyTo([31.910, 35.210], 12);
}

function toggleSearch() { $("#search-panel").fadeToggle(); }
</script>
</body>
</html>
