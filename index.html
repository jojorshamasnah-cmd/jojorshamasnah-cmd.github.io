<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Suite with Popups</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* أزرار التحكم */
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-basemap { background: #27ae60; }
        .btn-advisor { background: #f39c12; color: #000; }
        .btn-hazard { background: #d35400; }
        .btn-isolation { background: #8e44ad; }
        .btn-clear { background: #e74c3c; }

        /* الليجند */
        #legend-box { position: absolute; bottom: 85px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; border: 1px solid #ccc; overflow: hidden; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; }
        #legend-content { padding: 15px; max-height: 400px; overflow-y: auto; }
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 12px 0 6px 0; border-bottom: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
        .symbol-poly { width: 16px; height: 10px; border: 1px solid #555; margin-right: 8px; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ BaseMap</button>
    <button class="btn-tool btn-advisor" onclick="runSmartAdvisor()">🧠 Advisor</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard</button>
    <button class="btn-tool btn-isolation" onclick="runIsolationScanner()">🔍 Isolation</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Restore</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').slideToggle()">
        <span>📊 Analysis Legend</span> <span>▼</span>
    </div>
    <div id="legend-content">
        <div class="legend-section">Live Results</div>
        <div id="dynamic-items" style="color:gray;">Select a tool...</div>
        <div class="legend-section">Map Layers</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var isBaseMapVisible = true;
var layers = {};
var rawGeoData = {};
var analysisGroup = L.layerGroup().addTo(map);

function toggleBaseMap() { if (isBaseMapVisible) map.removeLayer(osmLayer); else osmLayer.addTo(map); isBaseMapVisible = !isBaseMapVisible; }

function loadLayer(file, name, type, style) {
    $.getJSON(file, function(data) {
        rawGeoData[name] = data;
        let l = L.geoJson(data, { style: style }).addTo(map);
        layers[name] = l;
    });
}

// تحميل الطبقات الأساسية
loadLayer("Agricultural_Land.geojson", "Agri", "poly", { color: "green", fillOpacity: 0.1 });
loadLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillOpacity: 0.1 });
loadLayer("Streams.geojson", "Streams", "line", { color: "#3498db" });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed", "poly", { color: "orange" });
loadLayer("Ramallah.geojson", "Boundary", "poly", { color: "black", fillOpacity: 0 });

// --- 1. بوب اب أداة المستشار ---
function runSmartAdvisor() {
    clearAnalysis();
    hideLayers();
    document.getElementById("dynamic-items").innerHTML = "تلوين الأراضي حسب القرب من المستوطنات...";

    L.geoJson(rawGeoData["Agri"], {
        style: function(f) {
            let dist = turf.distance(turf.centroid(f), turf.nearestPoint(turf.centroid(f), rawGeoData["Settlements"]), {units: 'kilometers'});
            if (dist < 0.7) return { fillColor: "#e74c3c", fillOpacity: 0.7, color: "red" };
            if (dist < 1.5) return { fillColor: "#f1c40f", fillOpacity: 0.7, color: "orange" };
            return { fillColor: "#2ecc71", fillOpacity: 0.7, color: "green" };
        },
        onEachFeature: function(f, l) {
            let d = turf.distance(turf.centroid(f), turf.nearestPoint(turf.centroid(f), rawGeoData["Settlements"]), {units:'kilometers'});
            let status = d < 0.7 ? "❌ منطقة خطر" : (d < 1.5 ? "⚠️ خطر متوسط" : "✅ منطقة آمنة");
            l.bindPopup(`<b>نتائج المستشار الذكي</b><hr>${status}<br>المسافة للمستوطنة: ${d.toFixed(2)} كم`);
        }
    }).addTo(analysisGroup);
}

// --- 2. بوب اب أداة المخاطر ---
function runHazardScanner() {
    clearAnalysis();
    hideLayers();
    if (rawGeoData["Streams"]) {
        let buff = turf.buffer(rawGeoData["Streams"], 0.2, {units:'kilometers'});
        L.geoJson(buff, {
            style: {fillColor:'#e74c3c', fillOpacity:0.5, color:'red'},
            onEachFeature: (f, l) => l.bindPopup("<b>⚠️ تنبيه مخاطر</b><hr>منطقة معرضة لفيضانات الأودية")
        }).addTo(analysisGroup);
    }
}

// --- 3. بوب اب أداة العزل ---
function runIsolationScanner() {
    clearAnalysis();
    hideLayers();
    if (rawGeoData["Closed"]) {
        L.geoJson(rawGeoData["Closed"], {
            style: {fillColor:'#8e44ad', fillOpacity:0.7, color:'purple'},
            onEachFeature: (f, l) => {
                let area = turf.area(f) / 1000000;
                l.bindPopup(`<b>🔍 تحليل العزل</b><hr>أرض معزولة خلف الجدار<br>المساحة: ${area.toFixed(2)} كم²`);
            }
        }).addTo(analysisGroup);
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers();
    for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]);
}

function hideLayers() {
    for (let k in layers) if (k !== "Boundary") map.removeLayer(layers[k]);
}
</script>
</body>
</html>
