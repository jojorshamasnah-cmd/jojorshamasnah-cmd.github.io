<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Final Professional Version</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 10px; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-hazard { background: #d35400; }
        .btn-clear { background: #7f8c8d; }
        #legend-box { position: absolute; bottom: 30px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; overflow: hidden; border: 1px solid #ccc; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        #legend-content { padding: 15px; max-height: 400px; overflow-y: auto; display: none; }
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 10px 0 5px 0; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .symbol-poly { width: 18px; height: 12px; border: 1px solid #555; margin-right: 10px; flex-shrink: 0; }
        .symbol-line { width: 22px; height: 3px; margin-right: 10px; flex-shrink: 0; }
        .symbol-icon { font-size: 16px; margin-right: 10px; width: 20px; text-align: center; }
        .map-icon { font-size: 20px; text-shadow: 0 0 3px white; text-align: center; line-height: 25px; }
    </style>
</head>

<body>

<div id="advisor-ui">
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Smart Advisor</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard Scanner</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Clear</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="toggleLegend()">
        <span>📊 Map Legend</span> <span id="arrow">▼</span>
    </div>
    <div id="legend-content">
        <div class="legend-section">Analysis Results</div>
        <div id="dynamic-items" style="color:gray; font-style:italic; margin-bottom:10px;">No tool selected...</div>
        <div class="legend-section">Base Map Layers</div>
        <div class="legend-item"><span class="symbol-icon">🏫</span> Schools</div>
        <div class="legend-item"><span class="symbol-icon">💧</span> Wells</div>
        <div class="legend-item"><span class="symbol-icon">⛏️</span> Quarries</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> Streams (Wadis)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-poly" style="border: 2px solid black; background:none;"></span> City Boundary</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = {};
var analysisGroup = L.layerGroup().addTo(map);
var overlayControl = L.control.layers(null, null, { collapsed: true }).addTo(map);

function toggleLegend() {
    var content = document.getElementById("legend-content");
    var arrow = document.getElementById("arrow");
    content.style.display = (content.style.display === "none" || content.style.display === "") ? "block" : "none";
    arrow.innerHTML = content.style.display === "none" ? "▼" : "▲";
}

function createMapIcon(emoji) {
    return L.divIcon({ html: `<div class="map-icon">${emoji}</div>`, className: 'custom-div-icon', iconSize: [25, 25], iconAnchor: [12, 12] });
}

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, { pointToLayer: (feature, latlng) => L.marker(latlng, { icon: createMapIcon(emoji) }) });
        } else {
            layer = L.geoJson(data, { style: style });
        }
        layer.addTo(map);
        layers[name] = layer;
        overlayControl.addOverlay(layer, name);
    });
}

// تحميل الطبقات
addLayer("Schools.geojson", "Schools", "point", null, "🏫");
addLayer("Wells.geojson", "Wells", "point", null, "💧");
addLayer("Quarries.geojson", "Quarries", "point", null, "⛏️");
addLayer("Roads.geojson", "Roads", "line", { color: "black", weight: 2 });
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db", weight: 2 });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillColor: "#8fd19e", fillOpacity: 0.2 });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillColor: "#ff6666", fillOpacity: 0.2 });
addLayer("Temperature.geojson", "Temperature Zones", "poly", { color: "blue", fillColor: "#87ceeb", fillOpacity: 0.1 });
addLayer("Ramallah.geojson", "Ramallah Boundary", "poly", { color: "black", weight: 2, fillOpacity: 0 });

// --- 🧠 1. المستشار الذكي (Smart Advisor) ---
function runSmartAdvisor() {
    clearAnalysis();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> High Potential (Green)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> Moderate Potential (Yellow)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:red"></span> Exclusion Zone (Red)</div>
    `;

    // الأحمر: المستوطنات
    if (layers["Settlements"]) {
        L.geoJson(layers["Settlements"].toGeoJSON(), { 
            style: { color: "darkred", fillColor: "red", fillOpacity: 0.6 } 
        }).bindPopup("<b>منطقة مستبعدة</b><br>لا يمكن الاستثمار داخل حدود المستوطنات.").addTo(analysisGroup);
    }

    if (layers["Agricultural Land"] && layers["Temperature Zones"]) {
        let agriJSON = layers["Agricultural Land"].toGeoJSON();
        let tempJSON = layers["Temperature Zones"].toGeoJSON();
        
        // الأصفر: أراضي زراعية ممتازة (إمكانية متوسطة)
        L.geoJson(agriJSON, {
            style: { color: "#d4ac0d", fillColor: "#f1c40f", fillOpacity: 0.5, weight: 1 },
            filter: function(f) { return f.properties.Agricult_1 && f.properties.Agricult_1.includes("High"); }
        }).bindPopup("<b>إمكانات متوسطة</b><br>تربة زراعية ممتازة.").addTo(analysisGroup);

        // الأخضر: التقاطع (تربة + حرارة مثالية 19-21)
        let highFeatures = [];
        agriJSON.features.forEach(land => {
            if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                tempJSON.features.forEach(t => {
                    if (t.properties.MEAN_ANNUA === "19 - 21") {
                        let intersect = turf.intersect(land, t);
                        if (intersect) highFeatures.push(intersect);
                    }
                });
            }
        });

        if (highFeatures.length > 0) {
            L.geoJson(turf.featureCollection(highFeatures), {
                style: { color: "#1d8348", fillColor: "#2ecc71", fillOpacity: 0.8 }
            }).bindPopup("<b style='color:green;'>فرصة استثمارية ذهبية</b><br>تربة ممتازة ومناخ مثالي.").addTo(analysisGroup);
        }
    }
}

// --- ⚠️ 2. ماسح الخطر (Hazard Scanner) ---
function runHazardScanner() {
    clearAnalysis();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#c0392b"></span> Flood Risk (150m)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e67e22"></span> Quarry Impact (500m)</div>
    `;

    // خطر الفيضان (Buffer 150m حول الأودية)
    if (layers["Streams"]) {
        let buffer = turf.buffer(layers["Streams"].toGeoJSON(), 0.15, { units: 'kilometers' });
        L.geoJson(buffer, { style: { color: "#c0392b", fillColor: "#e74c3c", fillOpacity: 0.5 } })
        .bindPopup("<b>خطر فيضان</b>: منطقة قريبة جداً من مجرى الوادي.").addTo(analysisGroup);
    }

    // خطر المحاجر (Buffer 500m حول الكسارات)
    if (layers["Quarries"]) {
        let qBuffer = turf.buffer(layers["Quarries"].toGeoJSON(), 0.5, { units: 'kilometers' });
        L.geoJson(qBuffer, { style: { color: "#d35400", fillColor: "#e67e22", fillOpacity: 0.5 } })
        .bindPopup("<b>تأثير بيئي</b>: منطقة متأثرة بالغبار والضجيج من المحاجر.").addTo(analysisGroup);
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers();
    document.getElementById("dynamic-items").innerHTML = "No tool selected...";
}
</script>
</body>
</html>
