<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Water Stress Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 10px; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-water { background: #2980b9; border: 2px solid #fff; }
        .btn-clear { background: #e74c3c; }
        #legend-box { position: absolute; bottom: 85px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; border: 1px solid #ccc; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        #legend-content { padding: 15px; max-height: 380px; overflow-y: auto; display: block; }
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 10px 0 5px 0; border-bottom: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .symbol-poly { width: 18px; height: 12px; border: 1px solid #555; margin-right: 10px; }
        .map-icon { font-size: 14px; text-shadow: 0 0 3px white; text-align: center; }
        .leaflet-control-scale { margin-left: 20px !important; margin-bottom: 25px !important; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Advisor</button>
    <button class="btn-tool btn-water" onclick="runWaterSensitivity()">💧 Water Stress Tool</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Clear & Restore</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').toggle()">
        <span>📊 Map Legend</span> <span>▼</span>
    </div>
    <div id="legend-content">
        <div class="legend-section">Analysis Results</div>
        <div id="dynamic-items" style="color:gray; font-style:italic;">No tool selected...</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

var layers = {};
var analysisGroup = L.layerGroup().addTo(map);

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, { 
                pointToLayer: (f, latlng) => L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon', iconSize: [18,18] }) }) 
            });
        } else {
            layer = L.geoJson(data, { style: style });
        }
        layer.addTo(map);
        layers[name] = layer;
    });
}

// تحميل الطبقات الأساسية بناءً على صورك
addLayer("Wells.geojson", "Wells", "point", null, "💧");
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db", weight: 2 });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillOpacity: 0.1 });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillColor: "#ff6666", fillOpacity: 0.2 });

function clearAnalysis() {
    analysisGroup.clearLayers();
    for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]);
    document.getElementById("dynamic-items").innerHTML = "Analysis cleared.";
}

function runWaterSensitivity() {
    analysisGroup.clearLayers();
    // إخفاء الطبقات الأساسية لتركيز الرؤية على التحليل
    for (let k in layers) map.removeLayer(layers[k]);

    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-icon">🔥</span> Threatened Wells (Near Settlements)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#3498db"></span> Dependent Farms (Near Streams)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#9b59b6"></span> Water Stress Zones (Far from sources)</div>
    `;

    try {
        // 1. الآبار المهددة (ضمن 300م من المستوطنات)
        if (layers["Wells"] && layers["Settlements"]) {
            let settBuffer = turf.union(...layers["Settlements"].toGeoJSON().features.map(f => turf.buffer(f, 0.3, {units:'kilometers'})));
            layers["Wells"].toGeoJSON().features.forEach(well => {
                if (turf.booleanPointInPolygon(well, settBuffer)) {
                    L.marker([well.geometry.coordinates[1], well.geometry.coordinates[0]], { 
                        icon: L.divIcon({ html: '🔥', className: 'map-icon' }) 
                    }).bindPopup(`<b>Threatened Well:</b> ${well.properties.WellName_E || 'Well'}`).addTo(analysisGroup);
                }
            });
        }

        // 2. المزارع المعتمدة على المجاري المائية (ضمن 200م)
        if (layers["Streams"] && layers["Agricultural Land"]) {
            let streamBuffer = turf.buffer(layers["Streams"].toGeoJSON(), 0.2, {units:'kilometers'});
            layers["Agricultural Land"].toGeoJSON().features.forEach(land => {
                let intersect = turf.intersect(land, streamBuffer);
                if (intersect) {
                    L.geoJson(intersect, { style: { color: "#2980b9", fillColor: "#3498db", fillOpacity: 0.6 } })
                    .bindPopup("<b>Dependent Farm</b>").addTo(analysisGroup);
                }
            });
        }

        // 3. مناطق الضغط المائي (أراضي عالية القيمة بعيدة > 1كم عن أي مصدر)
        if (layers["Agricultural Land"]) {
            let waterSources = [];
            if (layers["Wells"]) waterSources.push(...layers["Wells"].toGeoJSON().features);
            if (layers["Streams"]) waterSources.push(...layers["Streams"].toGeoJSON().features);
            
            // دمج كل مصادر المياه في منطقة واحدة لتجنب أخطاء الطرح
            let combinedSourceBuffer = turf.buffer(turf.featureCollection(waterSources), 1.0, {units:'kilometers'});
            let mergedSource = turf.union(...combinedSourceBuffer.features);

            layers["Agricultural Land"].toGeoJSON().features.forEach(land => {
                // التأكد من مسمى الخاصية كما في صورتك: Land of High Agricultural Value
                if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                    let stressArea = turf.difference(land, mergedSource);
                    if (stressArea) {
                        L.geoJson(stressArea, { style: { color: "#8e44ad", fillColor: "#9b59b6", fillOpacity: 0.7 } })
                        .bindPopup("<b>Water Stress Zone:</b> No water source within 1km").addTo(analysisGroup);
                    }
                }
            });
        }
    } catch (e) {
        console.error("Spatial analysis error:", e);
        alert("Check console: Data might have geometry issues.");
    }
}
</script>
</body>
</html>
