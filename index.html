<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Suite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-basemap { background: #27ae60; }
        .btn-hazard { background: #d35400; }
        .btn-story { background: #2980b9; } 
        .btn-isolation { background: #8e44ad; }
        .btn-clear { background: #e74c3c; border: 2px solid white; }
        .btn-tool:hover { transform: translateY(-2px); opacity: 0.9; }

        #story-panel { 
            position: absolute; top: 80px; right: 20px; width: 320px; 
            background: rgba(255, 255, 255, 0.95); border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 3000; 
            display: none; padding: 20px; border-top: 5px solid #2980b9; direction: rtl; 
        }
        .story-nav { display: flex; justify-content: space-between; margin-top: 15px; }
        .btn-nav { background: #34495e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        #legend-box { position: absolute; bottom: 85px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; border: 1px solid #ccc; overflow: hidden; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; }
        #legend-content { padding: 15px; max-height: 400px; overflow-y: auto; }
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 12px 0 6px 0; border-bottom: 1px solid #eee; padding-bottom: 3px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
        .symbol-poly { width: 16px; height: 10px; border: 1px solid #555; margin-right: 8px; flex-shrink: 0; }
        .symbol-line { width: 20px; height: 3px; margin-right: 8px; flex-shrink: 0; }
        .symbol-icon { font-size: 14px; margin-right: 8px; width: 18px; text-align: center; }
        .map-icon { font-size: 14px; text-shadow: 0 0 3px white; text-align: center; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ BaseMap</button>
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Advisor (أحمر/أخضر)</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard (مخاطر)</button>
    <button class="btn-tool btn-isolation" onclick="runIsolationScanner()">🔍 Isolation (العزل)</button>
    <button class="btn-tool btn-story" onclick="startStory()">📖 Story Mode</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Restore Layers</button>
</div>

<div id="story-panel">
    <h3 id="story-title" style="margin-top:0;"></h3>
    <p id="story-text" style="font-size: 14px; line-height: 1.6;"></p>
    <div class="story-nav">
        <button onclick="prevStep()" class="btn-nav">السابق</button>
        <button onclick="nextStep()" class="btn-nav">التالي</button>
    </div>
    <button onclick="closeStory()" style="margin-top:15px; width:100%; border:none; background:none; cursor:pointer; color:#e74c3c; font-weight:bold;">إنهاء الجولة</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').slideToggle()">
        <span>📊 Map Legend</span> <span>▼</span>
    </div>
    <div id="legend-content">
        <div id="analysis-legend-section">
            <div class="legend-section">Analysis Results</div>
            <div id="dynamic-items" style="color:gray; font-style:italic;">No tool selected...</div>
        </div>
        <div class="legend-section">Base Map Layers</div>
        <div class="legend-item"><span class="symbol-icon">🏫</span> Schools</div>
        <div class="legend-item"><span class="symbol-icon">💧</span> Wells</div>
        <div class="legend-item"><span class="symbol-icon">⛏️</span> Quarries</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> Streams (Wadis)</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555; border-top: 2px dashed #999;"></span> Annexation Wall</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> Closed Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> Built-up Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> Master Plans</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-poly" style="border: 2px solid black; background:none;"></span> Ramallah Boundary</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var isBaseMapVisible = true;
var layers = {};
var analysisGroup = L.layerGroup().addTo(map);
var currentStep = 0;

function toggleBaseMap() { if (isBaseMapVisible) map.removeLayer(osmLayer); else osmLayer.addTo(map); isBaseMapVisible = !isBaseMapVisible; }

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, { 
                pointToLayer: (f, latlng) => L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon', iconSize: [18,18] }) }) 
            });
        } else {
            layer = L.geoJson(data, { style: style });
        }
        layer.addTo(map);
        layers[name] = layer;
    });
}

// تحميل الطبقات الـ 13
addLayer("Schools.geojson", "Schools", "point", null, "🏫");
addLayer("Wells.geojson", "Wells", "point", null, "💧");
addLayer("Quarries.geojson", "Quarries", "point", null, "⛏️");
addLayer("Roads.geojson", "Roads", "line", { color: "black", weight: 1 });
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db", weight: 2 });
addLayer("Annexation_Wall.geojson", "Annexation Wall", "line", { color: "#555", weight: 3, dashArray: '5, 10' });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillColor: "#8fd19e", fillOpacity: 0.2 });
addLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "poly", { color: "orange", fillColor: "#ffb347", fillOpacity: 0.2 });
addLayer("Built_up.geojson", "Built-up Areas", "poly", { color: "brown", fillColor: "#c49a6c", fillOpacity: 0.2 });
addLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "poly", { color: "purple", fillColor: "#af7ac5", fillOpacity: 0.2 });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillColor: "#ff6666", fillOpacity: 0.2 });
addLayer("Temperature.geojson", "Temperature Zones", "poly", { color: "blue", fillColor: "#87ceeb", fillOpacity: 0.1 });
addLayer("Ramallah.geojson", "Ramallah Boundary", "poly", { color: "black", weight: 2, fillOpacity: 0 });

// 1. أداة المستشار الذكي (أحمر، أخضر، أصفر) مع بوب أب
function runSmartAdvisor() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> إمكانية عالية (أخضر)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> إمكانية متوسطة (أصفر)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> منطقة محظورة (أحمر)</div>
    `;

    // المنطقة الحمراء (حول المستوطنات)
    if (layers["Settlements"]) {
        let buff = turf.buffer(layers["Settlements"].toGeoJSON(), 0.5, {units:'kilometers'});
        L.geoJson(buff, {style: {color:'#c0392b', fillColor:'#e74c3c', fillOpacity:0.6}})
        .bindPopup("<b>نطاق محظور:</b> قرب المستوطنات").addTo(analysisGroup);
    }

    // الأخضر والأصفر (على الأراضي الزراعية)
    if (layers["Agricultural Land"]) {
        layers["Agricultural Land"].eachLayer(function(layer) {
            let val = layer.feature.properties.Agricult_1;
            let color = val && val.includes("High") ? "#2ecc71" : "#f1c40f";
            let status = val && val.includes("High") ? "إمكانية عالية جداً" : "إمكانية متوسطة";
            
            L.geoJson(layer.feature, {style: {fillColor: color, fillOpacity: 0.7, weight: 1, color: 'white'}})
            .bindPopup(`<b>مستشار التنمية:</b><br>التصنيف: ${status}`).addTo(analysisGroup);
        });
    }
}

// 2. ماسح المخاطر (الكسارات والستريمز) مع بوب أب
function runHazardScanner() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#e67e22"></span> خطر تلوث (كسارات)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#3498db"></span> خطر فيضان (أودية)</div>
    `;

    if (layers["Quarries"]) {
        let qBuff = turf.buffer(layers["Quarries"].toGeoJSON(), 0.8, {units:'kilometers'});
        L.geoJson(qBuff, {style:{color:'#d35400', fillColor:'#e67e22', fillOpacity:0.5}})
        .bindPopup("<b>تحذير:</b> منطقة تأثر بيئي ناتجة عن الكسارات").addTo(analysisGroup);
    }

    if (layers["Streams"]) {
        let sBuff = turf.buffer(layers["Streams"].toGeoJSON(), 0.2, {units:'kilometers'});
        L.geoJson(sBuff, {style:{color:'#2980b9', fillColor:'#3498db', fillOpacity:0.4}})
        .bindPopup("<b>تحذير فيضان:</b> نطاق الحماية المائي للأودية").addTo(analysisGroup);
    }
}

// 3. نظام كشف العزل
function runIsolationScanner() {
    clearAnalysis(); hideExceptBoundary();
    let total = 0;
    if (layers["Closed Areas"]) {
        layers["Closed Areas"].eachLayer(function(layer) {
            let props = layer.feature.properties;
            if (props.Key_ && props.Key_.includes("معزولة")) {
                let area = props.Shape_Area / 1000000;
                total += area;
                L.geoJson(layer.feature, {style:{color:'#4a235a', fillColor:'#8e44ad', fillOpacity:0.7}})
                .bindPopup(`<b>منطقة معزولة</b><br>المساحة: ${area.toFixed(2)} كم²`).addTo(analysisGroup);
            }
        });
        document.getElementById("dynamic-items").innerHTML = `<b>إجمالي العزل:</b> ${total.toFixed(2)} كم²`;
    }
}

// 4. وضع القصص (المشاهد الثلاثة الأصلية)
const storySteps = [
    {
        title: "المشهد 1: التوسع والمستوطنات",
        text: "نلاحظ تداخلاً بين المخططات الهيكلية والمستوطنات التي تفرض قيداً مكانياً يمنع توسع السكن الطبيعي.",
        center: [31.910, 35.260], zoom: 14,
        visibleLayers: ["Settlements", "Master Plans", "Ramallah Boundary"]
    },
    {
        title: "المشهد 2: الجدار والأراضي المعزولة",
        text: "هنا يظهر الجدار القائم الذي عزل مساحات شاسعة من الأراضي عالية القيمة الزراعية خلفه بالكامل.",
        center: [31.940, 35.130], zoom: 14,
        visibleLayers: ["Annexation Wall", "Agricultural Land", "Closed Areas", "Ramallah Boundary"]
    },
    {
        title: "المشهد 3: الموارد المائية",
        text: "تنتشر آبار المياه في المحافظة، ولكن وقوعها بالقرب من البؤر الاستيطانية يهدد استدامتها وجودتها.",
        center: [31.880, 35.230], zoom: 14,
        visibleLayers: ["Wells", "Settlements", "Quarries", "Ramallah Boundary"]
    }
];

function startStory() { clearAnalysis(); currentStep = 0; $("#story-panel").fadeIn(); updateStoryScene(); }
function updateStoryScene() {
    const step = storySteps[currentStep];
    $("#story-title").text(step.title); $("#story-text").text(step.text);
    map.flyTo(step.center, step.zoom, {duration: 2});
    for (let k in layers) {
        if (step.visibleLayers.includes(k)) { if(!map.hasLayer(layers[k])) map.addLayer(layers[k]); }
        else { map.removeLayer(layers[k]); }
    }
}
function nextStep() { if (currentStep < storySteps.length - 1) { currentStep++; updateStoryScene(); } }
function prevStep() { if (currentStep > 0) { currentStep--; updateStoryScene(); } }
function closeStory() { $("#story-panel").fadeOut(); clearAnalysis(); }

function hideExceptBoundary() { for (let k in layers) if (k !== "Ramallah Boundary") map.removeLayer(layers[k]); }
function clearAnalysis() {
    analysisGroup.clearLayers(); $("#story-panel").hide();
    for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]);
    document.getElementById("dynamic-items").innerHTML = "All layers restored.";
}
</script>
</body>
</html>
