<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS - Smart Advisor</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { height: 100vh; }

    /* ----------- LEGEND ----------- */
    #legend-box {
        position: absolute; bottom: 45px; left: 10px; background: white;
        padding: 10px 14px; border-radius: 10px; width: 220px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3); font-family: Arial; z-index: 9998;
    }

    #legend-title { font-weight: bold; text-align: center; font-size: 16px; cursor: pointer; user-select: none; }
    #legend-content { display: none; margin-top: 8px; font-size: 14px; }
    .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
    .emoji { font-size: 20px; width: 25px; margin-right: 6px; }
    .symbol-line { width: 30px; height: 4px; margin-right: 6px; }
    .symbol-poly { width: 22px; height: 12px; border: 1px solid #000; margin-right: 6px; }

    /* ----------- OPACITY BOX ----------- */
    #opacity-box {
        position: absolute; right: 10px; bottom: 45px; background: white;
        padding: 12px; border-radius: 10px; width: 220px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3); font-family: Arial; z-index: 9999;
    }

    /* ----------- SMART ADVISOR BOX ----------- */
    #advisor-box {
        position: absolute; right: 10px; top: 310px; background: white;
        padding: 15px; border-radius: 10px; width: 220px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3); font-family: Arial; z-index: 9999;
    }

    .box-title { font-weight: bold; text-align: center; font-size: 15px; margin-bottom: 8px; }
    select, input[type=range], input[type=number] { width: 100%; margin-top: 6px; box-sizing: border-box; }

    .btn-run {
        background: #28a745; color: white; border: none; padding: 10px;
        width: 100%; margin-top: 10px; cursor: pointer; border-radius: 5px; font-weight: bold;
    }

    .leaflet-control-scale { left: 50% !important; transform: translateX(-50%); bottom: 5px !important; }
</style>
</head>

<body>

<div id="map"></div>

<div id="advisor-box">
    <div class="box-title">🧠 Smart Advisor</div>
    <label style="font-size: 12px;">Distance from Roads (m):</label>
    <input type="number" id="buffer-val" value="200">
    
    <label style="font-size: 12px; margin-top: 10px; display: block;">Temperature Filter:</label>
    <select id="temp-val">
        <option value="all">All Zones</option>
        <option value="suitable">Moderate Zones Only</option>
    </select>
    
    <button class="btn-run" onclick="runSmartAnalysis()">Run Analysis 🚀</button>
    <div id="analysis-status" style="font-size: 11px; margin-top: 8px; color: blue; text-align: center;"></div>
</div>

<div id="opacity-box">
    <div class="box-title">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title">Legend ▼</div>
    <div id="legend-content">
        <div class="legend-item"><span class="emoji">🏫</span> Schools</div>
        <div class="legend-item"><span class="emoji">💧</span> Wells</div>
        <div class="legend-item"><span class="emoji">⛏️</span> Quarries</div>
        <hr>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#0077ff"></span> Streams</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555"></span> Annexation Wall</div>
        <hr>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> Closed Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> Built-up Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> Master Plans</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#87ceeb"></span> Temperature Zones</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({ imperial: false }).addTo(map);

var layers = { points: {}, lines: {}, polys: {} };
var control = L.control.layers({}, {}, { collapsed: false }).addTo(map);

function getPointIcon(type) {
    return L.divIcon({
        html: type === "Schools" ? "🏫" : type === "Wells" ? "💧" : type === "Quarries" ? "⛏️" : "•",
        className: "", iconSize: [25, 25], iconAnchor: [12, 12]
    });
}

function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function (data) {
        var layer;
        if (group === "points") {
            layer = L.geoJson(data, {
                pointToLayer: function (feature, latlng) { return L.marker(latlng, { icon: getPointIcon(name) }); }
            }).addTo(map);
        } else {
            layer = L.geoJson(data, { style: styleObj }).addTo(map);
        }
        layers[group][name] = layer;
        control.addOverlay(layer, name);
        document.getElementById("opacity-select").innerHTML += `<option value="${name}">${name}</option>`;
    });
}

var resultLayer = null;

function runSmartAnalysis() {
    let bufferVal = document.getElementById("buffer-val").value;
    let status = document.getElementById("analysis-status");
    
    if (resultLayer) map.removeLayer(resultLayer);
    status.innerHTML = "Processing...";

    // التأكد من تحميل الطبقات الأساسية
    if (!layers.lines["Roads"] || !layers.polys["Agricultural Land"]) {
        status.innerHTML = "⚠️ Error: Load Roads & Agri layers first.";
        return;
    }

    try {
        let roadsGeo = layers.lines["Roads"].toGeoJSON();
        let agriGeo = layers.polys["Agricultural Land"].toGeoJSON();

        // 1. عمل Buffer حول الطرق
        let bufferedRoads = turf.buffer(roadsGeo, bufferVal / 1000, {units: 'kilometers'});

        // 2. تقاطع ذكي لكل مضلع زراعي على حدة
        let suitableSites = [];
        agriGeo.features.forEach(function(f) {
            let intersect = turf.intersect(bufferedRoads, f);
            if (intersect) {
                suitableSites.push(intersect);
            }
        });

        if (suitableSites.length > 0) {
            let collection = turf.featureCollection(suitableSites);
            resultLayer = L.geoJson(collection, {
                style: { color: "gold", weight: 2, fillColor: "yellow", fillOpacity: 0.7 }
            }).addTo(map);
            
            map.fitBounds(resultLayer.getBounds());
            status.innerHTML = "✅ Found " + suitableSites.length + " sites!";
        } else {
            status.innerHTML = "❌ No matching areas.";
        }
    } catch (e) {
        status.innerHTML = "⚠️ Analysis Failed.";
        console.error(e);
    }
}

// Opacity Control
document.getElementById("opacity-slider").oninput = function () {
    let selected = document.getElementById("opacity-select").value;
    for (let g in layers) { if (layers[g][selected]) { layers[g][selected].setStyle({ opacity: this.value, fillOpacity: this.value }); } }
};

// Legend Toggle
document.getElementById("legend-title").onclick = function () {
    let c = document.getElementById("legend-content");
    c.style.display = c.style.display === "none" ? "block" : "none";
    this.innerHTML = c.style.display === "none" ? "Legend ▼" : "Legend ▲";
};

/* LOAD ALL YOUR ORIGINAL LAYERS */
loadLayer("Schools.geojson", "Schools", "points");
loadLayer("Wells.geojson", "Wells", "points");
loadLayer("Quarries.geojson", "Quarries", "points");
loadLayer("Roads.geojson", "Roads", "lines", { color:"black", weight:2 });
loadLayer("Streams.geojson", "Streams", "lines", { color:"#0077ff", weight:2 });
loadLayer("Annexation_Wall.geojson", "Annexation Wall", "lines", { color:"#555", weight:3 });
loadLayer("Agricultural_Land.geojson", "Agricultural Land", "polys", { color:"green", fillColor:"#8fd19e", fillOpacity:0.6 });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", { color:"orange", fillColor:"#ffb347", fillOpacity:0.6 });
loadLayer("Built_up.geojson", "Built-up Areas", "polys", { color:"brown", fillColor:"#c49a6c", fillOpacity:0.6 });
loadLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "polys", { color:"purple", fillColor:"#af7ac5", fillOpacity:0.6 });
loadLayer("Settlements.geojson", "Settlements", "polys", { color:"red", fillColor:"#ff6666", fillOpacity:0.6 });
loadLayer("Temperature.geojson", "Temperature Zones", "polys", { color:"blue", fillColor:"#87ceeb", fillOpacity:0.6 });
loadLayer("Ramallah.geojson", "Ramallah Boundary", "polys", { color:"black", fillOpacity:0 });

</script>
</body>
</html>
