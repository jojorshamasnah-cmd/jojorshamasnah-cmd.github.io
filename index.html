<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Pro Suite</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; background-color: #f4f4f4; }
        
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; font-size: 13px; }
        .btn-basemap { background: #27ae60; } 
        .btn-hazard { background: #d35400; }
        .btn-water { background: #2980b9; }
        .btn-clear { background: #e74c3c; }
        .btn-tool:hover { opacity: 0.9; transform: translateY(-1px); }
        
        #legend-box { position: absolute; bottom: 80px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; overflow: hidden; border: 1px solid #ccc; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        #legend-content { padding: 15px; max-height: 380px; overflow-y: auto; display: none; }
        
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 10px 0 5px 0; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .symbol-poly { width: 18px; height: 12px; border: 1px solid #555; margin-right: 10px; flex-shrink: 0; }
        .symbol-line { width: 22px; height: 3px; margin-right: 10px; flex-shrink: 0; }
        .symbol-icon { font-size: 16px; margin-right: 10px; width: 20px; text-align: center; }
        
        .map-icon { font-size: 14px; text-shadow: 0 0 3px white; text-align: center; line-height: 18px; }
    </style>
</head>

<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ Toggle BaseMap</button>
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Smart Advisor</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard Scanner</button>
    <button class="btn-tool btn-water" onclick="runWaterSensitivity()">💧 Water Sensitivity</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Clear & Reset</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="toggleLegend()">
        <span>📊 Map Legend</span> <span id="arrow">▼</span>
    </div>
    <div id="legend-content">
        <div id="analysis-legend">
            <div class="legend-section">Analysis Results</div>
            <div id="dynamic-items" style="color:gray; font-style:italic; margin-bottom:10px;">No tool selected...</div>
        </div>
        
        <div id="base-layers-legend">
            <div class="legend-section">Base Map Layers</div>
            <div class="legend-item"><span class="symbol-icon">🏫</span> Schools</div>
            <div class="legend-item"><span class="symbol-icon">💧</span> Wells</div>
            <div class="legend-item"><span class="symbol-icon">⛏️</span> Quarries</div>
            <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
            <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> Streams</div>
            <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
            <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        </div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 12);
var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var isBaseMapVisible = true;

function toggleBaseMap() {
    if (isBaseMapVisible) map.removeLayer(osmLayer);
    else osmLayer.addTo(map);
    isBaseMapVisible = !isBaseMapVisible;
}

var layers = {};
var analysisGroup = L.layerGroup().addTo(map);

function toggleLegend() {
    var content = document.getElementById("legend-content");
    content.style.display = (content.style.display === "none" || content.style.display === "") ? "block" : "none";
}

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, { pointToLayer: (f, latlng) => L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon' }) }) });
        } else {
            layer = L.geoJson(data, { style: style });
        }
        layer.addTo(map);
        layers[name] = layer;
        if (name === "Ramallah Boundary") map.fitBounds(layer.getBounds());
    });
}

// تحميل الطبقات
addLayer("Schools.geojson", "Schools", "point", null, "🏫");
addLayer("Wells.geojson", "Wells", "point", null, "💧");
addLayer("Quarries.geojson", "Quarries", "point", null, "⛏️");
addLayer("Roads.geojson", "Roads", "line", { color: "black", weight: 2 });
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db" });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillOpacity: 0.1 });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillOpacity: 0.1 });
addLayer("Temperature.geojson", "Temperature Zones", "poly", { color: "blue", fillOpacity: 0.05 });

function hideBaseLayers() {
    for (let k in layers) if (map.hasLayer(layers[k])) map.removeLayer(layers[k]);
    document.getElementById("base-layers-legend").style.display = "none";
}

function showBaseLayers() {
    for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]);
    document.getElementById("base-layers-legend").style.display = "block";
}

// --- 1. Smart Advisor (أخضر، أصفر، أحمر) ---
function runSmartAdvisor() {
    clearAnalysis();
    hideBaseLayers();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> High Potential (Green)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> Moderate Potential (Yellow)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> Exclusion Zone (Red)</div>
    `;

    // أحمر: مناطق المستوطنات
    if (layers["Settlements"]) {
        let buffer = turf.buffer(layers["Settlements"].toGeoJSON(), 0.3, { units: 'kilometers' });
        L.geoJson(buffer, { style: { color: "#c0392b", fillColor: "#e74c3c", fillOpacity: 0.7 } })
        .bindPopup("<b>Red Zone:</b> High Risk / Settlement Proximity").addTo(analysisGroup);
    }

    // أصفر وأخضر: الأراضي الزراعية
    if (layers["Agricultural Land"]) {
        let agriJSON = layers["Agricultural Land"].toGeoJSON();
        let tempJSON = layers["Temperature Zones"] ? layers["Temperature Zones"].toGeoJSON() : null;

        agriJSON.features.forEach(land => {
            if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                let isGolden = false;
                if (tempJSON) {
                    tempJSON.features.forEach(t => {
                        if (t.properties.MEAN_ANNUA === "19 - 21") {
                            let intersect = turf.intersect(land, t);
                            if (intersect) {
                                L.geoJson(intersect, { style: { color: "#1d8348", fillColor: "#2ecc71", fillOpacity: 0.8 } })
                                .bindPopup("<b>Green Zone:</b> Ideal Investment (Perfect Soil + Temp)").addTo(analysisGroup);
                                isGolden = true;
                            }
                        }
                    });
                }
                if (!isGolden) {
                    L.geoJson(land, { style: { color: "#d4ac0d", fillColor: "#f1c40f", fillOpacity: 0.6 } })
                    .bindPopup("<b>Yellow Zone:</b> Good Soil Potential").addTo(analysisGroup);
                }
            }
        });
    }
}

// --- 2. Hazard Scanner (ماسح الخطر) ---
function runHazardScanner() {
    clearAnalysis();
    hideBaseLayers();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> Flood Danger Zone</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e67e22"></span> Quarry Impact</div>
    `;

    if (layers["Streams"]) {
        let flood = turf.buffer(layers["Streams"].toGeoJSON(), 0.15, { units: 'kilometers' });
        L.geoJson(flood, { style: { color: "#922b21", fillColor: "#e74c3c", fillOpacity: 0.6 } })
        .bindPopup("<b>Danger:</b> Potential Flood Zone (150m from Wadi)").addTo(analysisGroup);
    }
    if (layers["Quarries"]) {
        let qImpact = turf.buffer(layers["Quarries"].toGeoJSON(), 0.5, { units: 'kilometers' });
        L.geoJson(qImpact, { style: { color: "#d35400", fillColor: "#e67e22", fillOpacity: 0.5 } })
        .bindPopup("<b>Warning:</b> Quarry Dust/Noise Impact Zone").addTo(analysisGroup);
    }
}

// --- 3. Water Sensitivity (حساسية المي) ---
function runWaterSensitivity() {
    clearAnalysis();
    hideBaseLayers();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#1abc9c"></span> Irrigation Priority Zone</div>
        <div class="legend-item"><span class="symbol-icon">⚠️</span> Critical Well</div>
    `;

    let sources = [];
    if (layers["Wells"]) {
        let wells = layers["Wells"].toGeoJSON();
        wells.features.filter(f => f.properties.WaterUse_E === "Agricultural").forEach(w => {
            L.marker([w.geometry.coordinates[1], w.geometry.coordinates[0]], { icon: L.divIcon({ html: '⚠️', className: 'map-icon' }) })
            .bindPopup(`<b>Critical Well:</b> ${w.properties.WellName_E}`).addTo(analysisGroup);
            sources.push(w);
        });
    }
    if (layers["Streams"]) sources.push(...layers["Streams"].toGeoJSON().features);

    if (layers["Agricultural Land"] && sources.length > 0) {
        let buff = turf.buffer(turf.featureCollection(sources), 0.3, { units: 'kilometers' });
        let agri = layers["Agricultural Land"].toGeoJSON();
        agri.features.forEach(land => {
            if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                let intersect = turf.intersect(land, buff);
                if (intersect) {
                    L.geoJson(intersect, { style: { color: "#16a085", fillColor: "#1abc9c", fillOpacity: 0.7 } })
                    .bindPopup("<b>Priority:</b> Strategic Land Near Water Source").addTo(analysisGroup);
                }
            }
        });
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers();
    showBaseLayers();
    document.getElementById("dynamic-items").innerHTML = "No tool selected...";
}
</script>
</body>
</html>
