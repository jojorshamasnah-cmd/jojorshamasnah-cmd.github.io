<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- ADD-ON LIBRARY (NO CHANGE TO ORIGINAL CODE) -->
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

<style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { height: 100vh; }

    /* ----------- LEGEND ----------- */
    #legend-box {
        position: absolute;
        bottom: 45px;
        left: 10px;
        background: white;
        padding: 10px 14px;
        border-radius: 10px;
        width: 220px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        font-family: Arial;
        z-index: 9998;
    }

    #legend-title {
        font-weight: bold;
        text-align: center;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
    }

    #legend-content {
        display: none;
        margin-top: 8px;
        font-size: 14px;
    }

    .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
    .emoji { font-size: 20px; width: 25px; margin-right: 6px; }

    .symbol-line { width: 30px; height: 4px; margin-right: 6px; }
    .symbol-poly { width: 22px; height: 12px; border: 1px solid #000; margin-right: 6px; }

    /* ----------- OPACITY BOX ----------- */
    #opacity-box {
        position: absolute;
        right: 10px;
        bottom: 45px;
        background: white;
        padding: 12px;
        border-radius: 10px;
        width: 220px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        font-family: Arial;
        z-index: 9999;
    }

    #opacity-title {
        font-weight: bold;
        text-align: center;
        font-size: 15px;
        margin-bottom: 8px;
    }

    select, input[type=range] {
        width: 100%;
        margin-top: 6px;
    }

    .leaflet-control-scale {
        left: 50% !important;
        transform: translateX(-50%);
        bottom: 5px !important;
    }
</style>
</head>

<body>

<div id="map"></div>

<!-- ADD-ON BUTTON -->
<div style="
position:absolute;
top:10px;
left:10px;
background:white;
padding:10px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
z-index:9999;
font-family:Arial;">
<button onclick="runInvestmentAdvisor()">📊 Smart Investment Advisor</button>
</div>

<!-- OPACITY BOX -->
<div id="opacity-box">
    <div id="opacity-title">Layer Opacity</div>
    <select id="opacity-select">
        <option value="" disabled selected>Select Layer</option>
    </select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<!-- LEGEND -->
<div id="legend-box">
    <div id="legend-title">Legend ▼</div>
    <div id="legend-content">
        <div class="legend-item"><span class="emoji">🏫</span> Schools</div>
        <div class="legend-item"><span class="emoji">💧</span> Wells</div>
        <div class="legend-item"><span class="emoji">⛏️</span> Quarries</div>
        <hr>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#0077ff"></span> Streams</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555"></span> Annexation Wall</div>
        <hr>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> Built-up Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#87ceeb"></span> Temperature Zones</div>
    </div>
</div>

<script>
/* ===== ORIGINAL CODE (UNCHANGED) ===== */

var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({ imperial: false }).addTo(map);

var layers = { points:{}, lines:{}, polys:{} };
var control = L.control.layers({}, {}, { collapsed: false }).addTo(map);

function getPointIcon(type) {
    return L.divIcon({
        html: type === "Schools" ? "🏫" :
              type === "Wells" ? "💧" :
              type === "Quarries" ? "⛏️" : "•",
        iconSize: [25, 25],
        iconAnchor: [12, 12]
    });
}

function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function (data) {
        var layer;
        if (group === "points") {
            layer = L.geoJson(data, {
                pointToLayer: (f,ll)=>L.marker(ll,{icon:getPointIcon(name)})
            }).addTo(map);
        } else {
            layer = L.geoJson(data, { style: styleObj }).addTo(map);
        }
        layers[group][name] = layer;
        control.addOverlay(layer, name);
        $("#opacity-select").append(`<option>${name}</option>`);
    });
}

$("#opacity-slider").on("input", function () {
    let n = $("#opacity-select").val();
    for (let g in layers)
        if (layers[g][n]) layers[g][n].setStyle({ opacity:this.value, fillOpacity:this.value });
});

$("#legend-title").click(function(){
    $("#legend-content").toggle();
});

/* LOAD DATA */
loadLayer("Schools.geojson","Schools","points");
loadLayer("Wells.geojson","Wells","points");
loadLayer("Quarries.geojson","Quarries","points");

loadLayer("Roads.geojson","Roads","lines",{color:"black"});
loadLayer("Streams.geojson","Streams","lines",{color:"#0077ff"});
loadLayer("Annexation_Wall.geojson","Annexation Wall","lines",{color:"#555"});

loadLayer("Agricultural_Land.geojson","Agricultural Land","polys",{color:"green",fillOpacity:0.6});
loadLayer("Built_up.geojson","Built-up Areas","polys",{color:"brown",fillOpacity:0.6});
loadLayer("Temperature.geojson","Temperature Zones","polys",{color:"blue",fillOpacity:0.6});

/* ===== ADD-ON FEATURE 1 ===== */

var investmentLayer;
function runInvestmentAdvisor() {

    if (investmentLayer) map.removeLayer(investmentLayer);

    let agri = layers.polys["Agricultural Land"].toGeoJSON();
    let temp = layers.polys["Temperature Zones"].toGeoJSON();
    let roads = layers.lines["Roads"].toGeoJSON();
    let built = layers.polys["Built-up Areas"].toGeoJSON();

    let roadBuffer = turf.buffer(roads, 0.5, { units: "kilometers" });
    let builtBuffer = turf.buffer(built, 0.7, { units: "kilometers" });

    agri.features.forEach(f => {
        let score = 3;
        temp.features.forEach(t => { if (turf.booleanIntersects(f,t)) score+=2; });
        if (turf.booleanIntersects(f,roadBuffer)) score+=2;
        if (turf.booleanIntersects(f,builtBuffer)) score+=1;
        f.properties.level = score>=6?"High":score>=4?"Medium":"Low";
    });

    investmentLayer = L.geoJson(agri,{
        style:f=>({
            fillOpacity:0.7,
            color:"#000",
            fillColor: f.properties.level==="High"?"#2ecc71":
                       f.properties.level==="Medium"?"#f1c40f":"#e74c3c"
        }),
        onEachFeature:(f,l)=>l.bindPopup("Suitability: "+f.properties.level)
    }).addTo(map);

    control.addOverlay(investmentLayer,"Investment Suitability");
}
</script>

</body>
</html>
