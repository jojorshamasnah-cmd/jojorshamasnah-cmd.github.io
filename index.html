<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Brain Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* 1. واجهة الترحيب - تغطي الشاشة بالكامل */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, #111, #000);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100000; /* فوق كل شيء */
            transition: all 1s ease;
        }

        #splash-screen h1 {
            color: #2ecc71;
            font-family: 'Segoe UI', sans-serif;
            font-size: 70px;
            letter-spacing: 10px;
            margin: 0;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }

        #start-btn {
            margin-top: 30px;
            padding: 15px 60px;
            background: transparent;
            color: white;
            border: 2px solid #2ecc71;
            border-radius: 50px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        #start-btn:hover {
            background: #2ecc71;
            box-shadow: 0 0 30px #2ecc71;
            color: black;
        }

        /* 2. الخريطة والعناصر */
        body, html { margin: 0; padding: 0; height: 100%; background: black; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: black; }

        .control-panel {
            position: absolute;
            background: rgba(20, 20, 20, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }
        #advisor-box { top: 20px; right: 20px; width: 220px; }
        .action-btn {
            width: 100%; padding: 10px; margin-top: 8px;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1>GEO BRAIN</h1>
        <p style="color: #555; letter-spacing: 3px;">ADVANCED ANALYTICS SYSTEM</p>
        <button id="start-btn" onclick="initSystem()">START</button>
    </div>

    <div id="map"></div>

    <div id="advisor-box" class="control-panel">
        <div style="text-align:center; font-weight:bold; border-bottom:1px solid #333; padding-bottom:10px;">SYSTEM CONTROLS</div>
        <button class="action-btn" style="background:#2ecc71; color:white;">📊 SMART ADVISOR</button>
        <button class="action-btn" style="background:#e67e22; color:white;">⚠️ RISK SCANNER</button>
    </div>

    <script>
        var map;
        var boundaryLayer;

        // دالة إخفاء الواجهة وبدء النظام
        function initSystem() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
            }, 1000);
        }

        // تهيئة الخريطة بستايل داكن
        map = L.map('map', {zoomControl: false}).setView([31.903, 35.203], 13);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            opacity: 1
        }).addTo(map);

        // --- وظيفة "القناع الأسود" (المهمة جداً) ---
        function applySpotlight(geoData) {
            // مضلع يغطي العالم كله
            var world = [
                [90, -180], [90, 180], [-90, 180], [-90, -180], [90, -180]
            ];

            // استخراج حدود رام الله من ملفك كـ "فتحات" (Holes) داخل المضلع العالمي
            var holes = [];
            geoData.features.forEach(feature => {
                if (feature.geometry.type === "Polygon") {
                    holes.push(feature.geometry.coordinates[0].map(p => [p[1], p[0]]));
                } else if (feature.geometry.type === "MultiPolygon") {
                    feature.geometry.coordinates.forEach(poly => {
                        holes.push(poly[0].map(p => [p[1], p[0]]));
                    });
                }
            });

            // رسم الطبقة السوداء التي تغطي العالم وتترك رام الله مكشوفة
            L.polygon([world, ...holes], {
                fillColor: 'black',
                fillOpacity: 0.95, // درجة العتمة حول المدينة
                color: 'black',
                weight: 0,
                interactive: false
            }).addTo(map);
        }

        // تحميل ملف الحدود (تأكد أن الاسم هو نفس اسم ملفك)
        // هذا الملف هو الذي سيحدد شكل "الثقب" في السواد
        $.getJSON("Approved_Urban_Master_Plans_super_simplified.geojson", function(data) {
            boundaryLayer = L.geoJson(data, {
                style: { color: "#2ecc71", weight: 2, fillOpacity: 0 }
            }).addTo(map);
            
            // تطبيق القناع فوراً
            applySpotlight(data);
            
            // زوم تلقائي على رام الله
            map.fitBounds(boundaryLayer.getBounds());
        }).fail(function() {
            console.error("خطأ: لم يتم العثور على ملف حدود رام الله. تأكد من اسم الملف.");
        });

    </script>
</body>
</html>
