<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Suite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-basemap { background: #27ae60; }
        .btn-hazard { background: #d35400; }
        .btn-isolation { background: #8e44ad; }
        .btn-story { background: #2980b9; } 
        .btn-measure { background: #f39c12 !important; }
        .btn-stats { background: #2ecc71 !important; }
        .btn-search { background: #34495e !important; }
        .btn-eco { background: #1abc9c !important; }
        .btn-clear { background: #e74c3c !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
        .btn-tool:hover { transform: translateY(-2px); opacity: 0.9; }

        #search-container { position: absolute; top: 70px; left: 60px; z-index: 1000; display: none; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 250px; }
        #search-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: right; }

        #measure-output { position: absolute; top: 15px; right: 20px; z-index: 2000; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; border-left: 5px solid #f39c12; font-weight: bold; direction: rtl; max-width: 250px; }
        #stats-panel { position: absolute; bottom: 30px; right: 20px; width: 300px; background: white; padding: 15px; border-radius: 12px; z-index: 3000; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.3); border-top: 5px solid #2ecc71; direction: rtl; }
        
        #story-panel { position: absolute; top: 80px; right: 20px; width: 350px; background: rgba(255, 255, 255, 0.98); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 3000; display: none; padding: 25px; border-top: 8px solid #2980b9; direction: rtl; }
        #story-title { margin-top:0; color:#2980b9; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        #story-text { font-size: 14px; line-height: 1.7; color: #333; margin: 15px 0; }
        .story-nav { display: flex; justify-content: space-between; margin-top: 15px; }
        .btn-nav { background: #34495e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        #legend-box { position: absolute; bottom: 85px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; border: 1px solid #ccc; overflow: hidden; direction: rtl; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        #legend-content { padding: 15px; max-height: 400px; overflow-y: auto; }
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 12px 0 6px 0; border-bottom: 1px solid #eee; padding-bottom: 3px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
        .symbol-poly { width: 16px; height: 10px; border: 1px solid #555; margin-left: 8px; flex-shrink: 0; }
        .symbol-line { width: 20px; height: 3px; margin-left: 8px; flex-shrink: 0; }
        .symbol-icon { font-size: 14px; margin-left: 8px; width: 18px; text-align: center; }
        .map-icon { font-size: 14px; text-shadow: 0 0 3px white; text-align: center; }

        .leaflet-control-layers { direction: rtl; text-align: right; border-radius: 8px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important; padding: 10px !important; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ الخريطة</button>
    <button class="btn-tool btn-measure" onclick="toggleMeasureTool()">📏 القياس</button>
    <button class="btn-tool btn-stats" onclick="runLiveStats()">📊 إحصائيات</button>
    <button class="btn-tool btn-search" onclick="toggleSearch()">🔍 بحث</button>
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 المستشار</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ مخاطر</button>
    <button class="btn-tool btn-isolation" onclick="runIsolationScanner()">🔍 عزل</button>
    <button class="btn-tool btn-eco" onclick="runEcoBuffer()">🌳 بيئة</button>
    <button class="btn-tool btn-story" onclick="startStory()">📖 قصة</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 استعادة</button>
</div>

<div id="search-container"><input type="text" id="search-input" placeholder="ابحث عن معلم..." onkeyup="executeSearch()"></div>
<div id="measure-output">النتيجة: <br><span id="measure-res" style="color:#d35400;">حدد نقطة للبدء</span></div>

<div id="stats-panel">
    <h4 style="margin:0 0 10px 0; color:#2c3e50; text-align:center;">إحصائيات الاستخدامات (2016)</h4>
    <canvas id="statsChart" style="max-height: 180px;"></canvas>
    <div id="stats-summary" style="font-size: 12px; margin-top: 12px; color: #333; line-height: 1.6; background: #f9f9f9; padding: 8px; border-radius: 5px; border: 1px solid #eee;"></div>
    <button onclick="$('#stats-panel').fadeOut()" style="margin-top:10px; width:100%; cursor:pointer; border:none; background:#eee; padding:8px; border-radius:5px; font-weight:bold;">إغلاق</button>
</div>

<div id="story-panel">
    <h3 id="story-title"></h3><div id="story-text"></div>
    <div class="story-nav">
        <button onclick="prevStep()" class="btn-nav">السابق</button>
        <button onclick="nextStep()" class="btn-nav">التالي</button>
    </div>
    <button onclick="closeStory()" style="margin-top:15px; width:100%; border:none; background:none; cursor:pointer; color:#e74c3c; font-weight:bold;">خروج</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').slideToggle()"><span>📊 مفتاح الخريطة</span> <span>▼</span></div>
    <div id="legend-content">
        <div class="legend-section">نتائج التحليل</div>
        <div id="dynamic-items" style="color:gray; font-style:italic;">لا توجد أداة مفعلة...</div>
        <div class="legend-section">الطبقات الأساسية</div>
        <div class="legend-item"><span class="symbol-icon">🏫</span> المدارس</div>
        <div class="legend-item"><span class="symbol-icon">💧</span> الآبار</div>
        <div class="legend-item"><span class="symbol-icon">⛏️</span> الكسارات</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> الطرق</div>
        <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> الأودية</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555; border-top: 2px dashed #999;"></span> جدار الضم</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> أراضي زراعية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> مناطق مغلقة</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> مناطق مبنية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> مخططات هيكلية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> مستوطنات</div>
        <div class="legend-item"><span class="symbol-poly" style="border: 2px solid black; background:none;"></span> حدود المدينة</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var layers = {}, analysisGroup = L.layerGroup().addTo(map), currentStep = 0, statsChartInstance = null;
var layerControl = L.control.layers({ "خريطة الشارع": osmLayer }, {}, { position: 'topright' }).addTo(map);

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer = L.geoJson(data, { 
            pointToLayer: (f, latlng) => type === "point" ? L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon', iconSize: [18,18] }) }) : null,
            style: type !== "point" ? style : null,
            onEachFeature: (f, l) => {
                let content = `<div style='direction:rtl; text-align:right;'><b>${name}</b><hr>`;
                for (let key in f.properties) { content += `<b>${key}:</b> ${f.properties[key]}<br>`; }
                l.bindPopup(content + "</div>");
            }
        });
        layer.addTo(map); layers[name] = layer; layerControl.addOverlay(layer, name);
    });
}

// تحميل الطبقات
addLayer("Schools.geojson", "المدارس", "point", null, "🏫");
addLayer("Wells.geojson", "الآبار", "point", null, "💧");
addLayer("Quarries.geojson", "الكسارات", "point", null, "⛏️");
addLayer("Roads.geojson", "الطرق", "line", { color: "black", weight: 1.5 });
addLayer("Streams.geojson", "الأودية", "line", { color: "#3498db", weight: 2 });
addLayer("Annexation_Wall.geojson", "جدار الضم والتوسع", "line", { color: "#555", weight: 3, dashArray: '5, 10' });
addLayer("Agricultural_Land.geojson", "أراضي زراعية", "poly", { color: "green", fillColor: "#8fd19e", fillOpacity: 0.2 });
addLayer("Areas_totaly_closed_by_the_wall.geojson", "مناطق مغلقة", "poly", { color: "orange", fillColor: "#ffb347", fillOpacity: 0.2 });
addLayer("Built_up.geojson", "مناطق مبنية", "poly", { color: "brown", fillColor: "#c49a6c", fillOpacity: 0.2 });
addLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "مخططات هيكلية", "poly", { color: "purple", fillColor: "#af7ac5", fillOpacity: 0.2 });
addLayer("Settlements.geojson", "مستوطنات", "poly", { color: "red", fillColor: "#ff6666", fillOpacity: 0.2 });
addLayer("Temperature.geojson", "نطاقات الحرارة", "poly", { color: "blue", fillOpacity: 0.1 });
addLayer("Ramallah.geojson", "حدود المدينة", "poly", { color: "black", weight: 3, fillOpacity: 0.05 });

// أدوات التحليل
function runSmartAdvisor() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#27ae60"></span> فرصة مثالية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c0392b"></span> خطر أمني (مستوطنات)</div>`;
    if (layers["مستوطنات"]) {
        let settleBuff = turf.buffer(layers["مستوطنات"].toGeoJSON(), 0.5, {units: 'kilometers'});
        L.geoJson(settleBuff, { style: { color: '#c0392b', fillOpacity: 0.5 } }).addTo(analysisGroup);
    }
    if (layers["أراضي زراعية"] && layers["نطاقات الحرارة"]) {
        let agriGeo = layers["أراضي زراعية"].toGeoJSON();
        let tempGeo = layers["نطاقات الحرارة"].toGeoJSON();
        agriGeo.features.forEach(land => {
            tempGeo.features.forEach(temp => {
                if (temp.properties.MEAN_ANNUA === "19 - 21") {
                    let inter = turf.intersect(land, temp);
                    if (inter) L.geoJson(inter, { style: { color: '#27ae60', fillOpacity: 0.7 } }).addTo(analysisGroup);
                }
            });
        });
    }
}

function runHazardScanner() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `<div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> خطر فيضان</div>`;
    if (layers["الأودية"]) {
        let flood = turf.buffer(layers["الأودية"].toGeoJSON(), 0.2, {units:'kilometers'});
        L.geoJson(flood, {style:{color:'#e74c3c', fillOpacity:0.5}}).addTo(analysisGroup);
    }
}

function runIsolationScanner() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `<div class="legend-item"><span class="symbol-poly" style="background:#8e44ad"></span> عزل الجدار</div>`;
    if (layers["مناطق مغلقة"]) L.geoJson(layers["مناطق مغلقة"].toGeoJSON(), { style: { color: '#8e44ad', fillOpacity: 0.6 } }).addTo(analysisGroup);
}

function runEcoBuffer() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `<div class="legend-item"><span class="symbol-poly" style="background:#1abc9c"></span> حماية بيئية</div>`;
    if (layers["الأودية"]) {
        let eco = turf.buffer(layers["الأودية"].toGeoJSON(), 0.3, {units: 'kilometers'});
        L.geoJson(eco, { style: { color: '#1abc9c', fillOpacity: 0.4 } }).addTo(analysisGroup);
    }
}

function runLiveStats() {
    $("#stats-panel").fadeIn();
    let agriA = 0, builtA = 0;
    if (layers["أراضي زراعية"]) layers["أراضي زراعية"].eachLayer(l => agriA += turf.area(l.feature));
    if (layers["مناطق مبنية"]) layers["مناطق مبنية"].eachLayer(l => builtA += turf.area(l.feature));
    let dAgri = (agriA/1000).toFixed(0), dBuilt = (builtA/1000).toFixed(0);
    $("#stats-summary").html(`<div style="text-align:center; color:#7f8c8d; border-bottom:1px solid #ddd; margin-bottom:5px;">المصدر: بيانات 2016</div>• زراعي: ${dAgri} دونم<br>• مبني: ${dBuilt} دونم`);
    if (statsChartInstance) statsChartInstance.destroy();
    statsChartInstance = new Chart(document.getElementById('statsChart').getContext('2d'), {
        type: 'pie', data: { labels: ['زراعي', 'مبني'], datasets: [{ data: [dAgri, dBuilt], backgroundColor: ['#2ecc71', '#e67e22'] }] }
    });
}

function clearAnalysis() {
    analysisGroup.clearLayers(); restoreAllLayers();
    $(".btn-nav").parent().parent().fadeOut(); $("#stats-panel").fadeOut();
    document.getElementById("dynamic-items").innerHTML = "لا توجد أداة مفعلة...";
}

function hideExceptBoundary() { for (let k in layers) if (k !== "حدود المدينة") map.removeLayer(layers[k]); }
function restoreAllLayers() { for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]); }
function toggleBaseMap() { if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer); else osmLayer.addTo(map); }
</script>
</body>
</html>
