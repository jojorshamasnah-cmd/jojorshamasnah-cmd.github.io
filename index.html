<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Smart Advisor Only</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 8px; }
        .btn-tool { background: #f39c12; color: #000; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-clear { background: #e74c3c; color: white; }

        #legend-box { position: absolute; bottom: 30px; left: 15px; background: white; border-radius: 12px; width: 250px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; padding: 15px; border: 1px solid #ccc; }
        .legend-title { font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .symbol-poly { width: 20px; height: 12px; margin-right: 10px; border: 1px solid #555; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 تشغيل المستشار الذكي</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 إعادة ضبط</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div class="legend-title">نتائج تحليل المستشار</div>
    <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> إمكانيات زراعية عالية (آمنة)</div>
    <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> منطقة تأثر متوسطة</div>
    <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> خطر عالي (قرب مستوطنات)</div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var rawGeoData = {}; 
var analysisGroup = L.layerGroup().addTo(map);

// تحميل البيانات المطلوبة للأداة فقط
function loadData(file, name) {
    $.getJSON(file, function(data) {
        rawGeoData[name] = data;
        if(name === "Boundary") L.geoJson(data, {style:{color:'black', fill:false, weight:2}}).addTo(map);
    });
}

loadData("Settlements.geojson", "Settlements");
loadData("Agricultural_Land.geojson", "Agri");
loadData("Ramallah.geojson", "Boundary");

// دالة المستشار الذكي
function runSmartAdvisor() {
    analysisGroup.clearLayers();
    
    if (!rawGeoData["Settlements"] || !rawGeoData["Agri"]) {
        alert("البيانات لا تزال تتحمل، انتظر ثانية واحدة...");
        return;
    }

    L.geoJson(rawGeoData["Agri"], {
        style: function(feature) {
            var center = turf.centroid(feature);
            var nearest = turf.nearestPoint(center, rawGeoData["Settlements"]);
            var dist = turf.distance(center, nearest, {units: 'kilometers'});

            // منطق الألوان بناءً على المسافة
            if (dist < 0.7) { 
                return { fillColor: "#e74c3c", fillOpacity: 0.8, color: "white", weight: 1 }; // أحمر
            } else if (dist < 1.5) {
                return { fillColor: "#f1c40f", fillOpacity: 0.8, color: "white", weight: 1 }; // أصفر
            } else {
                return { fillColor: "#2ecc71", fillOpacity: 0.8, color: "white", weight: 1 }; // أخضر
            }
        },
        onEachFeature: function(f, l) {
            var center = turf.centroid(f);
            var nearest = turf.nearestPoint(center, rawGeoData["Settlements"]);
            var dist = turf.distance(center, nearest, {units: 'kilometers'});
            l.bindPopup("<b>تحليل القطعة:</b><br>المسافة لأقرب مستوطنة: " + dist.toFixed(2) + " كم");
        }
    }).addTo(analysisGroup);

    if (analysisGroup.getLayers().length > 0) {
        map.fitBounds(analysisGroup.getLayers()[0].getBounds());
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers();
}
</script>
</body>
</html>
