<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah Smart WebGIS Portal</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* شريط الأدوات العلوي */
        #advisor-ui { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; display: flex; gap: 8px; align-items: center;
            background: rgba(255, 255, 255, 0.9); padding: 8px 15px; border-radius: 50px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid #ddd;
        }

        /* حاوية أدوات القياس (تظهر بجانب الأزرار) */
        #draw-tools-container {
            display: none; 
            background: #f8f9fa; border: 1px solid #ccc;
            padding: 2px 8px; border-radius: 30px;
            margin: 0 5px; align-items: center; gap: 5px;
        }

        /* تنسيق أزرار الرسم لتناسب الشريط */
        .leaflet-draw-toolbar a {
            background-color: transparent !important; border: none !important;
            width: 30px !important; height: 30px !important; line-height: 30px !important;
            display: inline-block !important; float: none !important;
        }

        .btn-tool { 
            background: #2c3e50; color: white; border: none; padding: 8px 16px; 
            border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; 
            transition: 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 5px;
        }
        .btn-basemap { background: #27ae60; }
        .btn-measure { background: #f39c12; }
        .btn-clear { background: #e74c3c; }
        .btn-tool:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        /* صندوق النتائج أسفل شريط الأدوات */
        #measure-output { 
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: white; padding: 12px 25px; border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; 
            border-bottom: 5px solid #f39c12; text-align: center; min-width: 200px;
        }

        /* صندوق التحكم بالطبقات (يسار) */
        #layer-control {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 200px;
            max-height: 70vh; overflow-y: auto; border: 1px solid #eee;
        }
        #layer-control h4 { margin: 0 0 12px 0; font-size: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .layer-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
        .layer-item input { margin-left: 10px; cursor: pointer; }

        /* مفتاح الخريطة (يمين أسفل) */
        #legend-box { 
            position: absolute; bottom: 30px; right: 20px; background: white; 
            border-radius: 12px; width: 260px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            z-index: 1000; border: 1px solid #ddd; overflow: hidden;
        }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        #legend-content { padding: 15px; max-height: 300px; overflow-y: auto; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .symbol { width: 18px; height: 12px; margin-left: 10px; border: 1px solid #777; flex-shrink: 0; }
        
        /* أيقونة الخريطة المخصصة */
        .map-icon { font-size: 16px; text-align: center; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ الخريطة</button>
    
    <div id="draw-tools-container"></div>
    
    <button class="btn-tool btn-measure" onclick="toggleMeasureTool()">📏 القياس</button>
    <button class="btn-tool" onclick="toggleSearch()" style="background:#34495e">🔍 بحث</button>
    <button class="btn-tool" onclick="runLiveStats()" style="background:#8e44ad">📊 إحصائيات</button>
    <button class="btn-tool btn-clear" onclick="clearAll()">🧹 مسح</button>
</div>

<div id="measure-output">
    <div style="font-size: 12px; color: #666; margin-bottom: 5px;">نتائج القياس الميداني</div>
    <div id="measure-res" style="font-size: 16px; color: #d35400; font-weight: bold;">اختر أداة من الشريط أعلاه</div>
</div>

<div id="layer-control">
    <h4>طبقات الخريطة</h4>
    <div id="layers-list"></div>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').slideToggle()">
        <span>📊 مفتاح الرموز</span>
        <span>▼</span>
    </div>
    <div id="legend-content">
        <div id="base-legend"></div>
    </div>
</div>

<script>
    // 1. إعداد الخريطة والطبقة الأساسية
    var map = L.map("map", { zoomControl: false }).setView([31.903, 35.203], 12);
    var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    var isBaseMapVisible = true;
    var layers = {};

    // 2. إعداد أدوات القياس (Leaflet Draw)
    var measureGroup = new L.FeatureGroup().addTo(map);
    var drawControl = new L.Control.Draw({
        edit: { featureGroup: measureGroup },
        draw: { 
            polygon: { shapeOptions: { color: '#f39c12' } },
            polyline: { shapeOptions: { color: '#f39c12' } },
            rectangle: { shapeOptions: { color: '#f39c12' } },
            circle: false, marker: false, circlemarker: false 
        }
    });

    // نقل أزرار الرسم إلى الشريط العلوي
    map.addControl(drawControl);
    $(".leaflet-draw-section").detach().appendTo("#draw-tools-container");

    // 3. وظيفة زر القياس
    function toggleMeasureTool() {
        let container = $("#draw-tools-container");
        let output = $("#measure-output");
        
        if (container.is(":visible")) {
            container.hide();
            output.fadeOut();
            measureGroup.clearLayers();
        } else {
            container.css("display", "flex").hide().fadeIn();
            output.fadeIn();
        }
    }

    // 4. معالجة نتائج الرسم والقياس
    map.on(L.Draw.Event.CREATED, function (e) {
        measureGroup.clearLayers();
        var layer = e.layer;
        measureGroup.addLayer(layer);
        
        let resultText = "";
        if (e.layerType === 'polyline') {
            let distance = 0;
            let coords = layer.getLatLngs();
            for (let i = 0; i < coords.length - 1; i++) {
                distance += coords[i].distanceTo(coords[i+1]);
            }
            resultText = `الطول الإجمالي: ${(distance / 1000).toFixed(2)} كم`;
        } else {
            let area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
            resultText = `المساحة: ${(area / 1000000).toFixed(2)} كم² <br> (${(area / 1000).toFixed(0)} دونم)`;
        }
        $("#measure-res").html(resultText);
    });

    // 5. وظيفة إضافة الطبقات مع التحكم والمفتاح
    function addGeoJsonLayer(file, name, arabicName, type, color, emoji) {
        $.getJSON(file, function(data) {
            let layer = L.geoJson(data, {
                style: { color: color, weight: 2, fillOpacity: 0.3, fillColor: color },
                pointToLayer: (feature, latlng) => {
                    return L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon' }) });
                },
                onEachFeature: (f, l) => {
                    l.bindPopup(`<b>${arabicName}</b><br>معلومات من قاعدة البيانات`);
                }
            }).addTo(map);
            
            layers[name] = layer;

            // إضافة للصندوق
            let safeId = name.replace(/\s+/g, '-');
            $("#layers-list").append(`
                <div class="layer-item">
                    <input type="checkbox" id="chk-${safeId}" checked onchange="toggleVisibility('${name}', this.checked)">
                    <label for="chk-${safeId}">${arabicName}</label>
                </div>
            `);

            // إضافة للمفتاح
            let symbol = "";
            if (type === 'poly') symbol = `<div class="symbol" style="background:${color}"></div>`;
            else if (type === 'line') symbol = `<div class="symbol" style="height:3px; background:${color}"></div>`;
            else symbol = `<div class="symbol" style="border:none; text-align:center;">${emoji}</div>`;
            
            $("#base-legend").append(`<div class="legend-item">${symbol} <span>${arabicName}</span></div>`);
        });
    }

    // 6. تحميل طبقات رام الله (استبدل الروابط بملفاتك)
    addGeoJsonLayer("Ramallah.geojson", "Boundary", "حدود البلدية", "poly", "#2c3e50", "");
    addGeoJsonLayer("Roads.geojson", "Roads", "شبكة الطرق", "line", "#555", "");
    addGeoJsonLayer("Agricultural_Land.geojson", "Agri", "المناطق الزراعية", "poly", "#27ae60", "");
    addGeoJsonLayer("Schools.geojson", "Schools", "المدارس", "point", "", "🏫");
    addGeoJsonLayer("Settlements.geojson", "Settlements", "المستوطنات", "poly", "#e74c3c", "");

    // 7. التحكم العام
    function toggleVisibility(name, isVisible) {
        if (isVisible) map.addLayer(layers[name]);
        else map.removeLayer(layers[name]);
    }

    function toggleBaseMap() {
        if (isBaseMapVisible) map.removeLayer(osmLayer);
        else osmLayer.addTo(map);
        isBaseMapVisible = !isBaseMapVisible;
    }

    function clearAll() {
        measureGroup.clearLayers();
        $("#measure-output").fadeOut();
        $("#draw-tools-container").hide();
        $("#measure-res").text("اختر أداة من الشريط أعلاه");
    }

    function toggleSearch() { alert("جاري تفعيل محرك البحث الجغرافي..."); }
    function runLiveStats() { alert("جاري تحليل بيانات الطبقات..."); }

</script>
</body>
</html>
