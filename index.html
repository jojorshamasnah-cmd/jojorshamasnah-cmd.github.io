<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS - GeoBrain</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* --- واجهة الترحيب (تظهر فوق كل شيء) --- */
#welcome-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: radial-gradient(circle, #2c3e50, #000); /* تدرج فخم بدلاً من السواد السادة */
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 100000;
    transition: opacity 0.8s ease, visibility 0.8s;
    color: white;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

#welcome-screen.hidden {
    opacity: 0;
    visibility: hidden;
}

.logo-title {
    font-size: 65px;
    font-weight: 900;
    background: linear-gradient(45deg, #2ecc71, #3498db);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0; letter-spacing: 12px;
}

#start-btn {
    margin-top: 35px;
    padding: 15px 65px;
    background: transparent;
    color: #2ecc71;
    border: 3px solid #2ecc71;
    border-radius: 50px;
    font-size: 22px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.4s;
    text-transform: uppercase;
}

#start-btn:hover {
    background: #2ecc71;
    color: white;
    box-shadow: 0 0 30px rgba(46, 204, 113, 0.5);
    transform: scale(1.05);
}

/* --- تنسيقات الخريطة والعناصر الأصلية كما هي --- */
body, html { margin:0; padding:0; height:100%; overflow: hidden; }
#map{height:100vh; width: 100vw; z-index: 1;}

#legend-box{position:absolute;bottom:45px;left:10px;background:white;padding:10px 14px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9998;}
#legend-title{font-weight:bold;text-align:center;font-size:16px;cursor:pointer;user-select:none;}
#legend-content{display:none;margin-top:8px;font-size:14px;}
.legend-item{display:flex;align-items:center;margin-bottom:5px;}

#opacity-box{position:absolute;right:10px;bottom:45px;background:white;padding:12px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9999;}
#advisor-box{position:absolute;right:10px;bottom:220px;background:white;padding:10px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.3);z-index:9999;width:220px;font-family:Arial;}
#advisor-box button {width:100%; margin-top:5px; padding:8px; cursor:pointer; font-weight:bold;}
</style>
</head>
<body>

<div id="welcome-screen">
    <h1 class="logo-title">Geo Brain</h1>
    <p style="color: #bdc3c7; letter-spacing: 4px;">RAMALLAH GEOSPATIAL ANALYSIS</p>
    <button id="start-btn" onclick="startApp()">START SYSTEM</button>
</div>

<div id="map"></div>

<div id="opacity-box">
    <div style="font-weight:bold; text-align:center;">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title">Legend ▼</div>
    <div id="legend-content">
        <div class="legend-item">🏫 Schools</div>
        <div class="legend-item">💧 Wells</div>
        <hr>
        <div class="legend-item">🟣 Ramallah Master Plan</div>
    </div>
</div>

<div id="advisor-box">
    <button onclick="runSmartAdvisor()" style="background:#2ecc71; color:white; border:none;">📊 Run Smart Advisor</button>
    <button onclick="runRiskScanner()" style="background:#f39c12; color:white; border:none;">⚠️ Run Risk Scanner</button>
    <button id="export-btn" onclick="unifiedPDFExport()" style="background:#2c3e50; color:white; display:none; border:none;">📄 Export PDF</button>
</div>

<script>
// دالة بدء النظام وإخفاء الواجهة
function startApp() {
    document.getElementById('welcome-screen').classList.add('hidden');
}

// تهيئة الخريطة (خريطة عادية واضحة جداً)
var map = L.map("map").setView([31.903, 35.203], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var layers = {points:{}, lines:{}, polys:{}};
var control = L.control.layers({}, {}, {collapsed:false}).addTo(map);

// تحميل الطبقات كما كانت في كودك الأصلي
function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function(data) {
        var layer;
        if(group === "points") {
            layer = L.geoJson(data, {
                pointToLayer: (f, latlng) => L.marker(latlng, {
                    icon: L.divIcon({html: name === "Schools" ? "🏫" : "💧", className: "", iconSize: [25, 25]})
                })
            }).addTo(map);
        } else {
            layer = L.geoJson(data, {style: styleObj}).addTo(map);
        }
        layers[group][name] = layer;
        control.addOverlay(layer, name);
        document.getElementById("opacity-select").innerHTML += `<option value="${name}">${name}</option>`;
    });
}

// استدعاء ملفاتك (تأكد من وجودها)
loadLayer("Schools.geojson", "Schools", "points");
loadLayer("Wells.geojson", "Wells", "points");
loadLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "polys", {color: "purple", fillOpacity: 0.5});

// وظائف التحكم
document.getElementById("legend-title").onclick = function() {
    let c = document.getElementById("legend-content");
    c.style.display = c.style.display === "none" ? "block" : "none";
};

document.getElementById("opacity-slider").oninput = function() {
    let selected = document.getElementById("opacity-select").value;
    for(let g in layers) {
        if(layers[g][selected] && layers[g][selected].setStyle) {
            layers[g][selected].setStyle({fillOpacity: this.value, opacity: this.value});
        }
    }
};

// وظائف التحليل (تكملة الكود الخاص بك)
function runSmartAdvisor() { alert("Analysis Started..."); }
function runRiskScanner() { alert("Scanning Risks..."); }
</script>

</body>
</html>
