<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map{height:100vh;}

#legend-box, #opacity-box, #advisor-box{
    position:absolute;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    z-index:9999;
    font-family:Arial;
}
#legend-box{bottom:45px;left:10px;width:220px;}
#opacity-box{bottom:45px;right:10px;width:220px;}
#advisor-box{bottom:220px;right:10px;width:220px;}
#advisor-box button{width:100%;margin-top:5px;cursor:pointer;}

.leaflet-control-scale{
    left:50% !important;
    transform:translateX(-50%);
    bottom:5px !important;
}
</style>
</head>

<body>
<div id="map"></div>

<div id="opacity-box">
    <b>Layer Opacity</b>
    <select id="opacity-select"></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <b>Legend</b><br>
    🟩 High – 🟨 Medium – 🟥 Low
</div>

<div id="advisor-box">
    <button onclick="runSmartAdvisor()">📊 Run Smart Advisor</button>
    <button onclick="generatePDF()">📄 Export PDF</button>
</div>

<script>
var map = L.map("map").setView([31.903,35.203],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({imperial:false}).addTo(map);

var layers={points:{},lines:{},polys:{}};
var control=L.control.layers({}, {}, {collapsed:false}).addTo(map);

function loadLayer(file,name,group,style){
    $.getJSON(file,function(data){
        var layer=L.geoJson(data,{style:style}).addTo(map);
        layers[group][name]=layer;
        control.addOverlay(layer,name);
        document.getElementById("opacity-select").innerHTML+=`<option value="${name}">${name}</option>`;
    });
}

loadLayer("Agricultural_Land.geojson","Agricultural Land","polys",{color:"green",fillOpacity:0.4});
loadLayer("Built_up.geojson","Built-up Areas","polys",{color:"brown",fillOpacity:0.4});
loadLayer("Roads.geojson","Roads","lines",{color:"black"});
loadLayer("Temperature.geojson","Temperature Zones","polys",{color:"blue",fillOpacity:0.3});
loadLayer("Ramallah.geojson","Ramallah Boundary","polys",{color:"black",fillOpacity:0});

var investmentLayer;

function runSmartAdvisor(){
    let agri=layers.polys["Agricultural Land"].toGeoJSON();
    let temp=layers.polys["Temperature Zones"].toGeoJSON();
    let roads=layers.lines["Roads"].toGeoJSON();
    let built=layers.polys["Built-up Areas"].toGeoJSON();

    let roadBuffer=turf.buffer(roads,0.5,{units:"kilometers"});
    let builtBuffer=turf.buffer(built,0.3,{units:"kilometers"});

    agri.features.forEach(f=>{
        let score=1;
        temp.features.forEach(t=>{if(turf.booleanIntersects(f,t)) score+=2;});
        if(turf.booleanIntersects(f,roadBuffer)) score+=1.5;
        if(turf.booleanIntersects(f,builtBuffer)) score-=1;
        f.properties.level=score>=5?"High":score>=3?"Medium":"Low";
    });

    if(investmentLayer) map.removeLayer(investmentLayer);

    investmentLayer=L.geoJson(agri,{
        style:f=>({
            color:"#000",
            fillOpacity:0.7,
            fillColor:f.properties.level==="High"?"#2ecc71":
                     f.properties.level==="Medium"?"#f1c40f":"#e74c3c"
        })
    }).addTo(map);

    control.addOverlay(investmentLayer,"Smart Investment Zones");
}

// ✅ PDF CLEAN EXPORT
function generatePDF(){
    if(!investmentLayer) return alert("Run Smart Advisor first!");

    let originalBounds = map.getBounds();

    document.querySelector(".leaflet-control-layers").style.display="none";
    document.getElementById("legend-box").style.display="none";
    document.getElementById("opacity-box").style.display="none";
    document.getElementById("advisor-box").style.display="none";

    map.fitBounds(layers.polys["Ramallah Boundary"].getBounds());
    map.invalidateSize();

    setTimeout(()=>{
        html2canvas(document.getElementById("map"),{scale:2}).then(canvas=>{
            const {jsPDF}=window.jspdf;
            const doc=new jsPDF("landscape","px",[canvas.width,canvas.height+100]);
            doc.text("Smart Investment Report",20,30);
            doc.addImage(canvas.toDataURL("image/png"),"PNG",0,50,canvas.width,canvas.height);
            doc.save("Investment_Report.pdf");

            document.querySelector(".leaflet-control-layers").style.display="";
            document.getElementById("legend-box").style.display="";
            document.getElementById("opacity-box").style.display="";
            document.getElementById("advisor-box").style.display="";
            map.fitBounds(originalBounds);
            map.invalidateSize();
        });
    },500);
}
</script>
</body>
</html>
