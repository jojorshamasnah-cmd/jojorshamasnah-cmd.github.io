<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Brain Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* 1. واجهة الترحيب (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a1a1a, #000);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        #splash-screen h1 {
            font-size: 60px;
            background: linear-gradient(45deg, #2ecc71, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; letter-spacing: 8px;
        }

        #start-btn {
            margin-top: 25px;
            padding: 12px 50px;
            background: transparent;
            color: #2ecc71;
            border: 2px solid #2ecc71;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #start-btn:hover {
            background: #2ecc71;
            color: black;
            box-shadow: 0 0 20px #2ecc71;
        }

        /* 2. تنسيق الخريطة */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100vw; visibility: hidden; } /* مخفية حتى نضغط Start */

        /* صناديق التحكم */
        .ui-panel {
            position: absolute;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            border: 1px solid #444;
            display: none; /* تظهر بعد الضغط على Start */
        }
        #advisor-box { top: 20px; right: 20px; width: 220px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1>GEO BRAIN</h1>
        <p style="color: #888; letter-spacing: 2px;">RAMALLAH ANALYTICS SYSTEM</p>
        <button id="start-btn" onclick="startSystem()">START</button>
    </div>

    <div id="map"></div>

    <div id="advisor-box" class="ui-panel">
        <h3 style="margin: 0 0 10px 0; font-size: 16px; text-align: center; color: #2ecc71;">Control Panel</h3>
        <button onclick="alert('Running Analysis...')" style="width:100%; padding:8px; background:#2ecc71; border:none; color:black; font-weight:bold; cursor:pointer;">📊 Smart Advisor</button>
    </div>

    <script>
        var map;

        // دالة البدء
        function startSystem() {
            // إخفاء واجهة الترحيب
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('map').style.visibility = 'visible';
                $(".ui-panel").fadeIn();
            }, 800);
        }

        // إعداد الخريطة
        map = L.map('map', {zoomControl: true}).setView([31.903, 35.203], 12);

        // إضافة ستايل خريطة داكن واحترافي (CartoDB Dark Matter)
        // هذا الستايل سيجعل كل شيء داكن لكن الخريطة والشوارع واضحة جداً
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; GeoBrain Pro'
        }).addTo(map);

        // دالة لتحميل حدود محافظة رام الله
        function loadRamallahBoundary() {
            // ملاحظة: استبدل اسم الملف باسم ملف الحدود الموجود عندك
            $.getJSON("Approved_Urban_Master_Plans_super_simplified.geojson", function(data) {
                var boundaryStyle = {
                    "color": "#2ecc71", // لون الحدود أخضر فسفوري احترافي
                    "weight": 3,
                    "opacity": 1,
                    "fillOpacity": 0.1 // تظليل خفيف جداً داخل المدينة
                };

                var geoLayer = L.geoJson(data, {
                    style: boundaryStyle
                }).addTo(map);

                // جعل الكاميرا تركز تلقائياً على حدود رام الله
                map.fitBounds(geoLayer.getBounds());
            }).fail(function() {
                console.warn("ملف الحدود غير موجود، الخريطة ستعمل بشكل عادي.");
            });
        }

        // تحميل الملفات الأخرى (المدارس، الآبار...) بنفس الطريقة
        function loadDataLayers() {
            // مثال لتحميل المدارس
            $.getJSON("Schools.geojson", function(data) {
                L.geoJson(data, {
                    pointToLayer: function(f, latlng) {
                        return L.marker(latlng, {
                            icon: L.divIcon({html: "🏫", className: "", iconSize: [20, 20]})
                        });
                    }
                }).addTo(map);
            });
        }

        // تشغيل التحميل
        loadRamallahBoundary();
        loadDataLayers();

    </script>
</body>
</html>
