<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS - GeoBrain Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; overflow: hidden; }
#map{height:100vh; width: 100vw;}

#legend-box{position:absolute;bottom:45px;left:10px;background:white;padding:10px 14px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9998;}
#legend-title{font-weight:bold;text-align:center;font-size:16px;cursor:pointer;user-select:none;}
#legend-content{display:none;margin-top:8px;font-size:14px;}
.legend-item{display:flex;align-items:center;margin-bottom:5px;}
.emoji{font-size:20px;width:25px;margin-right:6px;}
.symbol-line{width:30px;height:4px;margin-right:6px;}
.symbol-poly{width:22px;height:12px;border:1px solid #000;margin-right:6px;}

#opacity-box{position:absolute;right:10px;bottom:45px;background:white;padding:12px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9999;}
#opacity-title{font-weight:bold;text-align:center;font-size:15px;margin-bottom:8px;}
select,input[type=range]{width:100%;margin-top:6px;}

#advisor-box{position:absolute;right:10px;bottom:220px;background:white;padding:10px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.3);z-index:9999;font-family:Arial;width:220px;}
#advisor-box button{width:100%; margin-top:5px; cursor:pointer; padding:8px; border-radius:4px; border:1px solid #ccc; font-weight:bold;}
</style>
</head>
<body>
<div id="map"></div>

<div id="opacity-box">
    <div id="opacity-title">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title">Legend ▼</div>
    <div id="legend-content">
        <div class="legend-item"><span class="emoji">🏫</span> Schools</div>
        <div class="legend-item"><span class="emoji">💧</span> Wells</div>
        <div class="legend-item"><span class="emoji">⛏️</span> Quarries</div>
        <hr>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#0077ff"></span> Streams</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555"></span> Annexation Wall</div>
        <hr>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> Closed Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> Built-up Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> Master Plans</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#87ceeb"></span> Temperature Zones</div>
        <hr>
        <div class="legend-item"><span class="symbol-poly" style="background:#003366"></span> Water Risk (Populated)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#00d2ff"></span> Water Sensitive</div>
    </div>
</div>

<div id="advisor-box">
    <button onclick="runSmartAdvisor()" style="background:#2ecc71; color:white;">📊 Smart Advisor</button>
    <button onclick="runRiskScanner()" style="background:#f39c12; color:white;">⚠️ Risk Scanner</button>
    <button onclick="runWaterSensitivity()" style="background:#3498db; color:white;">💧 Water Sensitivity</button>
    <button id="export-btn" onclick="unifiedPDFExport()" style="background:#2c3e50; color:white; display:none;">📄 Export PDF Report</button>
</div>

<script>
var map=L.map("map").setView([31.903,35.203],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({imperial:false}).addTo(map);

var layers={points:{},lines:{},polys:{}};
var control=L.control.layers({}, {}, {collapsed:false}).addTo(map);
var lastAnalysis = ""; 

function getPointIcon(type){ return L.divIcon({html:type==="Schools"?"🏫":type==="Wells"?"💧":type==="Quarries"?"⛏️":"•",className:"",iconSize:[25,25],iconAnchor:[12,12]}); }

function loadLayer(file,name,group,styleObj,callback){
    $.getJSON(file,function(data){
        var layer;
        if(group==="points"){ layer=L.geoJson(data,{pointToLayer:(f,latlng)=>L.marker(latlng,{icon:getPointIcon(name)})}).addTo(map);}
        else{layer=L.geoJson(data,{style:styleObj}).addTo(map);}
        layers[group][name]=layer;
        control.addOverlay(layer,name);
        document.getElementById("opacity-select").innerHTML+=`<option value="${name}">${name}</option>`;
        if(callback) callback();
    }).fail(function() { console.log("Error loading: " + file); });
}

// التحكم في الشفافية
document.getElementById("opacity-slider").oninput=function(){
    let selected=document.getElementById("opacity-select").value;
    for(let group in layers){
        if(layers[group][selected]) {
            if(layers[group][selected].setStyle) {
                layers[group][selected].setStyle({opacity:this.value, fillOpacity:this.value});
            } else {
                layers[group][selected].eachLayer(lyr => lyr.setOpacity(this.value));
            }
        }
    }
};

document.getElementById("legend-title").onclick=function(){
    let c=document.getElementById("legend-content");
    c.style.display=c.style.display==="none"?"block":"none";
    this.innerHTML=c.style.display==="none"?"Legend ▼":"Legend ▲";
};

// تحميل كافة الطبقات والتأكد من ظهورها في القائمة
loadLayer("Schools.geojson","Schools","points");
loadLayer("Wells.geojson","Wells","points");
loadLayer("Quarries.geojson","Quarries","points");
loadLayer("Roads.geojson","Roads","lines",{color:"black",weight:2});
loadLayer("Streams.geojson","Streams","lines",{color:"#0077ff",weight:2});
loadLayer("Annexation_Wall.geojson","Annexation Wall","lines",{color:"#555",weight:3});
loadLayer("Agricultural_Land.geojson","Agricultural Land","polys",{color:"green",fillColor:"#8fd19e",fillOpacity:0.6});
loadLayer("Areas_totaly_closed_by_the_wall.geojson","Closed Areas","polys",{color:"orange",fillColor:"#ffb347",fillOpacity:0.6});
loadLayer("Built_up.geojson","Built-up Areas","polys",{color:"brown",fillColor:"#c49a6c",fillOpacity:0.6});
loadLayer("Approved_Urban_Master_Plans_super_simplified.geojson","Master Plans","polys",{color:"purple",fillColor:"#af7ac5",fillOpacity:0.6});
loadLayer("Settlements.geojson","Settlements","polys",{color:"red",fillColor:"#ff6666",fillOpacity:0.6});
loadLayer("Temperature.geojson","Temperature Zones","polys",{color:"blue",fillColor:"#87ceeb",fillOpacity:0.6});

// 1. المستشار الذكي
var investmentLayer;
function runSmartAdvisor(){
    lastAnalysis = "investment";
    document.getElementById("export-btn").style.display = "block";
    let agri = layers.polys["Agricultural Land"].toGeoJSON();
    let temp = layers.polys["Temperature Zones"].toGeoJSON();
    let roads = layers.lines["Roads"].toGeoJSON();
    let built = layers.polys["Built-up Areas"].toGeoJSON();
    
    let roadBuffer = turf.buffer(roads, 0.5, {units: "kilometers"});
    let builtBuffer = turf.buffer(built, 0.3, {units: "kilometers"});

    agri.features.forEach(f => {
        let score = 1;
        temp.features.forEach(t => { if(turf.booleanIntersects(f, t)) score += 2; });
        if(turf.booleanIntersects(f, roadBuffer)) score += 1.5;
        if(turf.booleanIntersects(f, builtBuffer)) score -= 1;
        f.properties.level = score >= 5 ? "High" : (score >= 3 ? "Medium" : "Low");
    });
    if(investmentLayer){ map.removeLayer(investmentLayer); control.removeLayer(investmentLayer); }
    investmentLayer = L.geoJson(agri, {
        style: f => ({ fillOpacity: 0.7, color: "#000", weight: 1, fillColor: f.properties.level === "High" ? "#2ecc71" : f.properties.level === "Medium" ? "#f1c40f" : "#e74c3c" }),
        onEachFeature: (f, l) => { l.bindPopup(`<b>Smart Investment Suitability: ${f.properties.level}</b>`); }
    }).addTo(map);
    control.addOverlay(investmentLayer, "Smart Investment Zones");
    alert("Smart Advisor Activated!");
}

// 2. ماسح المخاطر
var riskLayer;
function runRiskScanner() {
    lastAnalysis = "risk";
    document.getElementById("export-btn").style.display = "block";
    let qData = layers.points["Quarries"].toGeoJSON();
    let sData = layers.lines["Streams"].toGeoJSON();
    let qBuf = turf.buffer(qData, 1, {units: "kilometers"});
    let fBuf = turf.buffer(sData, 0.3, {units: "kilometers"});
    if(riskLayer){ map.removeLayer(riskLayer); control.removeLayer(riskLayer); }
    riskLayer = L.geoJson(null, {
        style: f => ({ color: f.properties.riskType === "Quarry" ? "#e67e22" : "#3498db", fillOpacity: 0.6 }),
        onEachFeature: (f, l) => { l.bindPopup(f.properties.desc); }
    }).addTo(map);
    qBuf.features.forEach(f => { f.properties = { riskType: "Quarry", desc: "Quarry Risk Area (Dust/Noise)" }; riskLayer.addData(f); });
    fBuf.features.forEach(f => { f.properties = { riskType: "Flood", desc: "Potential Flood Risk Area" }; riskLayer.addData(f); });
    control.addOverlay(riskLayer, "Environmental Risk Zones");
    alert("Risk Scanner Activated!");
}

// 3. محلل حساسية المياه (النسخة المطورة مع السكان)
var waterLayer;
function runWaterSensitivity() {
    lastAnalysis = "water";
    document.getElementById("export-btn").style.display = "block";
    let wells = layers.points["Wells"].toGeoJSON();
    let streams = layers.lines["Streams"].toGeoJSON();
    let agri = layers.polys["Agricultural Land"].toGeoJSON();
    let built = layers.polys["Built-up Areas"].toGeoJSON();

    let streamBuffer = turf.buffer(streams, 0.08, {units: "kilometers"});

    if(waterLayer){ map.removeLayer(waterLayer); control.removeLayer(waterLayer); }
    waterLayer = L.geoJson(null, {
        style: f => ({
            color: f.properties.isPopulated ? "#003366" : "#00d2ff",
            fillColor: f.properties.isPopulated ? "#003366" : "#00d2ff",
            fillOpacity: 0.7, weight: 1
        }),
        onEachFeature: (f, l) => { l.bindPopup(f.properties.desc); }
    }).addTo(map);

    agri.features.forEach(a => {
        if(turf.booleanIntersects(a, streamBuffer)) {
            let isPopulated = false;
            built.features.forEach(b => { if(turf.booleanIntersects(a, b)) isPopulated = true; });
            a.properties.isPopulated = isPopulated;
            a.properties.desc = isPopulated ? "<b>Populated Water Risk:</b> High pollution threat" : "<b>Sensitive:</b> Land near water stream";
            waterLayer.addData(a);
        }
    });
    control.addOverlay(waterLayer, "Water Sensitivity Zones");
    alert("Water Sensitivity Analysis Activated!");
}

function unifiedPDFExport() {
    let title = (lastAnalysis === "investment") ? "Smart Investment Report" : (lastAnalysis === "risk" ? "Environmental Risk Report" : "Water Sensitivity Report");
    generatePDF(title);
}

function generatePDF(title){
    let targetLayer = (lastAnalysis === "investment") ? investmentLayer : (lastAnalysis === "risk" ? riskLayer : waterLayer);
    let originalBounds = map.getBounds();
    map.fitBounds(targetLayer.getBounds());
    
    // إخفاء الطبقات مؤقتاً للتصدير النظيف
    for(let g in layers) for(let l in layers[g]) map.removeLayer(layers[g][l]);
    
    html2canvas(document.getElementById("map"), {scale:2, useCORS: true}).then(canvas=>{
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width, canvas.height + 150] });
        doc.setFontSize(22); doc.text(title, 20, 30);
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 50, canvas.width, canvas.height);
        doc.setFontSize(14);
        doc.text("Generated by GeoBrain WebGIS - Ramallah Municipality Analysis", 20, canvas.height + 80);
        doc.save(lastAnalysis + "_Report.pdf");
        
        // إعادة الطبقات بعد التصدير
        for(let g in layers) for(let l in layers[g]) map.addLayer(layers[g][l]);
        map.fitBounds(originalBounds);
    });
}
</script>
</body>
</html>
