<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- 🔴 Spatial Analysis -->
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map { height:100vh; }

#legend-box {
    position:absolute; bottom:45px; left:10px;
    background:white; padding:10px 14px;
    border-radius:10px; width:220px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    z-index:9998; font-family:Arial;
}

#legend-title { font-weight:bold; text-align:center; cursor:pointer; }
#legend-content { display:none; margin-top:8px; }

.legend-item { display:flex; align-items:center; margin-bottom:5px; }
.emoji { font-size:20px; width:25px; }

#opacity-box {
    position:absolute; right:10px; bottom:45px;
    background:white; padding:12px;
    border-radius:10px; width:220px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    z-index:9999;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- OPACITY -->
<div id="opacity-box">
<b>Layer Opacity</b>
<select id="opacity-select" style="width:100%"></select>
<input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<!-- LEGEND -->
<div id="legend-box">
<div id="legend-title">Legend ▼</div>
<div id="legend-content">
<div>🟢 High Investment</div>
<div>🟡 Medium Investment</div>
<div>🔴 Low Investment</div>
</div>
</div>

<!-- ANALYSIS BUTTON -->
<button id="investment-btn"
style="position:absolute; top:10px; right:10px; z-index:9999;
padding:8px 14px; border-radius:8px;
border:none; background:#2c3e50; color:white; font-weight:bold;">
📊 Investment Suitability
</button>

<script>
var map = L.map("map").setView([31.903,35.203],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({imperial:false}).addTo(map);

var layers = { points:{}, lines:{}, polys:{} };
var control = L.control.layers({}, {}, {collapsed:false}).addTo(map);

function getPointIcon(type){
return L.divIcon({
html: type==="Schools"?"🏫":type==="Wells"?"💧":"⛏️",
iconSize:[25,25], className:""
});
}

function loadLayer(file,name,group,styleObj){
$.getJSON(file,function(data){
var layer;
if(group==="points"){
layer=L.geoJson(data,{
pointToLayer:(f,ll)=>L.marker(ll,{icon:getPointIcon(name)})
}).addTo(map);
}else{
layer=L.geoJson(data,{style:styleObj}).addTo(map);
}
layer._geojson=data;
layers[group][name]=layer;
control.addOverlay(layer,name);
$("#opacity-select").append(`<option value="${name}">${name}</option>`);
});
}

/* LOAD DATA */
loadLayer("Schools.geojson","Schools","points");
loadLayer("Wells.geojson","Wells","points");
loadLayer("Quarries.geojson","Quarries","points");

loadLayer("Roads.geojson","Roads","lines",{color:"black"});
loadLayer("Streams.geojson","Streams","lines",{color:"blue"});
loadLayer("Annexation_Wall.geojson","Annexation Wall","lines",{color:"gray"});

loadLayer("Agricultural_Land.geojson","Agricultural Land","polys",{fillColor:"#8fd19e",fillOpacity:0.6});
loadLayer("Built_up.geojson","Built-up Areas","polys",{fillColor:"#c49a6c",fillOpacity:0.6});
loadLayer("Temperature.geojson","Temperature Zones","polys",{fillColor:"#87ceeb",fillOpacity:0.6});
loadLayer("Ramallah.geojson","Ramallah Boundary","polys",{color:"black",fillOpacity:0});

/* OPACITY */
$("#opacity-slider").on("input",function(){
let v=$("#opacity-select").val();
for(let g in layers){
if(layers[g][v]){
layers[g][v].setStyle({opacity:this.value,fillOpacity:this.value});
}}
});

/* LEGEND TOGGLE */
$("#legend-title").click(function(){
$("#legend-content").toggle();
});

/* 🔥 INVESTMENT ANALYSIS */
$("#investment-btn").click(function(){

let agri = layers.polys["Agricultural Land"]._geojson;
let temp = layers.polys["Temperature Zones"]._geojson;
let roads = layers.lines["Roads"]._geojson;
let built = layers.polys["Built-up Areas"]._geojson;

let roadBuffer = turf.buffer(roads,0.5,{units:"kilometers"});
let agriTemp = turf.intersect(agri,temp);
let nearRoads = turf.intersect(agriTemp,roadBuffer);
let finalZones = turf.difference(nearRoads,built);

finalZones.features.forEach(f=>{
let a=turf.area(f);
f.properties.rank = a>300000?"High":a>100000?"Medium":"Low";
});

let investmentLayer=L.geoJson(finalZones,{
style:f=>({
color:f.properties.rank==="High"?"green":
f.properties.rank==="Medium"?"orange":"red",
fillColor:f.properties.rank==="High"?"#2ecc71":
f.properties.rank==="Medium"?"#f1c40f":"#e74c3c",
fillOpacity:0.7
}),
onEachFeature:(f,l)=>l.bindPopup(
"<b>Investment Suitability</b><br>"+
"Rank: "+f.properties.rank)
}).addTo(map);

control.addOverlay(investmentLayer,"Investment Suitability Zones");
});
</script>

</body>
</html>
