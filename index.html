<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoBrain Pro - Ramallah WebGIS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* --- واجهة الترحيب (Splash Screen) --- */
        #welcome-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #1a1a1a;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 99999;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            transition: all 0.6s ease-in-out;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo-container h1 {
            font-size: 60px; margin: 0;
            background: linear-gradient(45deg, #2ecc71, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 4px;
        }

        #start-btn {
            margin-top: 30px; padding: 15px 60px;
            font-size: 20px; font-weight: bold; color: white;
            background: transparent; border: 2px solid #2ecc71;
            border-radius: 30px; cursor: pointer; transition: 0.3s;
        }

        #start-btn:hover {
            background: #2ecc71; box-shadow: 0 0 25px rgba(46, 204, 113, 0.6);
        }

        /* --- تنسيقات الخريطة --- */
        body, html { margin:0; padding:0; height:100%; overflow: hidden; }
        #map { height:100vh; width: 100vw; z-index: 1; }

        .ui-panel {
            position: absolute; background: white; padding: 12px;
            border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-family: Arial; z-index: 999;
        }

        #legend-box { bottom: 45px; left: 10px; width: 220px; }
        #opacity-box { right: 10px; bottom: 45px; width: 220px; }
        #advisor-box { right: 10px; bottom: 220px; width: 220px; }

        #legend-content { display: none; margin-top: 8px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .emoji { font-size: 18px; width: 25px; }
        .symbol-line { width: 25px; height: 3px; margin-right: 8px; }
        .symbol-poly { width: 20px; height: 12px; border: 1px solid #000; margin-right: 8px; }

        button.action-btn { width: 100%; margin-top: 5px; cursor: pointer; padding: 8px; border-radius: 4px; border: none; font-weight: bold; color: white; }
    </style>
</head>
<body>

<div id="welcome-screen">
    <div class="logo-container">
        <h1>Geo Brain</h1>
        <p style="text-align: center; color: #888;">Intelligent Geospatial Analysis Tool</p>
    </div>
    <button id="start-btn" onclick="launchApp()">START</button>
</div>

<div id="map"></div>

<div id="opacity-box" class="ui-panel">
    <div style="font-weight:bold; text-align:center; margin-bottom:5px;">Layer Opacity</div>
    <select id="opacity-select" style="width:100%;"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1" style="width:100%; margin-top:10px;">
</div>

<div id="legend-box" class="ui-panel">
    <div id="legend-title" style="font-weight:bold; text-align:center; cursor:pointer;">Legend ▼</div>
    <div id="legend-content">
        <div class="legend-item"><span class="emoji">🏫</span> Schools</div>
        <div class="legend-item"><span class="emoji">💧</span> Wells</div>
        <div class="legend-item"><span class="emoji">⛏️</span> Quarries</div>
        <hr>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#0077ff"></span> Streams</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555"></span> Wall</div>
        <hr>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> Closed Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> Master Plans</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
    </div>
</div>

<div id="advisor-box" class="ui-panel">
    <button class="action-btn" onclick="alert('Smart Advisor Active')" style="background:#2ecc71;">📊 Smart Advisor</button>
    <button class="action-btn" onclick="alert('Risk Scanner Active')" style="background:#f39c12;">⚠️ Risk Scanner</button>
    <button class="action-btn" id="export-btn" style="background:#2c3e50; display:none;">📄 Export PDF</button>
</div>

<script>
    function launchApp() {
        document.getElementById('welcome-screen').classList.add('hidden');
    }

    var map = L.map("map").setView([31.903, 35.203], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    var layers = {points: {}, lines: {}, polys: {}};
    var control = L.control.layers({}, {}, {collapsed: false}).addTo(map);

    function loadLayer(file, name, group, styleObj) {
        $.getJSON(file, function(data) {
            var layer;
            if (group === "points") {
                layer = L.geoJson(data, {
                    pointToLayer: (f, latlng) => L.marker(latlng, {
                        icon: L.divIcon({
                            html: name === "Schools" ? "🏫" : name === "Wells" ? "💧" : "⛏️",
                            className: "", iconSize: [25, 25]
                        })
                    })
                }).addTo(map);
            } else {
                layer = L.geoJson(data, {style: styleObj}).addTo(map);
            }
            layers[group][name] = layer;
            control.addOverlay(layer, name);
            document.getElementById("opacity-select").innerHTML += `<option value="${name}">${name}</option>`;
        }).fail(function() { console.log("File not found: " + file); });
    }

    // --- تحميل كافة الطبقات الـ 11 ---
    loadLayer("Schools.geojson", "Schools", "points");
    loadLayer("Wells.geojson", "Wells", "points");
    loadLayer("Quarries.geojson", "Quarries", "points");
    
    loadLayer("Roads.geojson", "Roads", "lines", {color: "black", weight: 2});
    loadLayer("Streams.geojson", "Streams", "lines", {color: "#0077ff", weight: 2});
    loadLayer("Annexation_Wall.geojson", "Wall", "lines", {color: "#555", weight: 3});
    
    loadLayer("Agricultural_Land.geojson", "Agricultural", "polys", {color: "green", fillOpacity: 0.4});
    loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", {color: "orange", fillOpacity: 0.4});
    loadLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "polys", {color: "purple", fillOpacity: 0.4});
    loadLayer("Settlements.geojson", "Settlements", "polys", {color: "red", fillOpacity: 0.4});
    loadLayer("Temperature.geojson", "Temperature", "polys", {color: "blue", fillOpacity: 0.2});

    // تفاعل القوائم
    document.getElementById("legend-title").onclick = function() {
        $("#legend-content").toggle();
    };

    document.getElementById("opacity-slider").oninput = function() {
        let selected = document.getElementById("opacity-select").value;
        for (let g in layers) {
            if (layers[g][selected] && layers[g][selected].setStyle) {
                layers[g][selected].setStyle({fillOpacity: this.value, opacity: this.value});
            }
        }
    };
</script>
</body>
</html>
