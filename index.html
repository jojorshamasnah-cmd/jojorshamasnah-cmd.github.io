<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Advanced Suite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Toolbar */
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-basemap { background: #27ae60; }
        .btn-hazard { background: #d35400; }
        .btn-isolation { background: #8e44ad; }
        .btn-story { background: #2980b9; } 
        .btn-clear { background: #e74c3c; }
        .btn-tool:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Opacity Box (New Separate Box) */
        #opacity-box { 
            position: absolute; top: 15px; right: 15px; width: 220px; 
            background: white; border-radius: 12px; z-index: 2000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 1px solid #ccc;
        }
        #opacity-title { font-weight: bold; padding: 10px; background: #34495e; color: white; border-radius: 12px 12px 0 0; font-size: 13px; text-align: center;}
        #opacity-content { padding: 10px; max-height: 300px; overflow-y: auto; }
        .opacity-item { margin-bottom: 8px; font-size: 11px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .opacity-slider { width: 100%; height: 4px; accent-color: #2980b9; cursor: pointer; }

        /* Story & Legend */
        #story-panel { position: absolute; top: 80px; right: 15px; width: 300px; background: rgba(255, 255, 255, 0.95); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 3000; display: none; padding: 20px; border-top: 5px solid #2980b9; }
        #legend-box { position: absolute; bottom: 85px; left: 15px; background: white; border-radius: 12px; width: 250px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; border: 1px solid #ccc; overflow: hidden; }
        #legend-title { font-weight: bold; padding: 10px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        #legend-content { padding: 12px; max-height: 350px; overflow-y: auto; font-size: 12px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .symbol-poly { width: 14px; height: 10px; border: 1px solid #555; margin-right: 8px; }
        .map-icon { font-size: 14px; text-shadow: 0 0 3px white; text-align: center; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ BaseMap</button>
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Advisor</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard</button>
    <button class="btn-tool btn-isolation" onclick="runIsolationScanner()">🔍 Isolation</button>
    <button class="btn-tool btn-story" onclick="startStory()">📖 Story Mode</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Restore</button>
</div>

<div id="opacity-box">
    <div id="opacity-title">🎚️ Layer Opacity</div>
    <div id="opacity-content" id="opacity-list"></div>
</div>

<div id="story-panel">
    <h3 id="story-title" style="margin-top:0;"></h3>
    <p id="story-text" style="font-size: 14px; color: #444;"></p>
    <div class="story-nav" style="display:flex; justify-content:space-between;">
        <button onclick="prevStep()">Previous</button>
        <button onclick="nextStep()">Next</button>
    </div>
    <button onclick="closeStory()" style="width:100%; margin-top:10px; color:red;">Exit</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').slideToggle()">
        <span>📊 Legend</span> <span>▼</span>
    </div>
    <div id="legend-content">
        <div id="dynamic-items" style="color:gray; font-style:italic; margin-bottom:10px;">No analysis active...</div>
        <hr>
        <div id="static-legend-items"></div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var isBaseMapVisible = true;
var layers = {};
var analysisGroup = L.layerGroup().addTo(map);
var currentStep = 0;

function toggleBaseMap() {
    if (isBaseMapVisible) map.removeLayer(osmLayer);
    else osmLayer.addTo(map);
    isBaseMapVisible = !isBaseMapVisible;
}

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, { 
                pointToLayer: (f, latlng) => L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon', iconSize: [18,18] }) }) 
            });
        } else {
            layer = L.geoJson(data, { 
                style: style,
                onEachFeature: function(feature, l) {
                    if (name === "Ramallah Boundary") {
                        let nAr = feature.properties.CommunityN || "";
                        let nEn = feature.properties.Communit_1 || "";
                        l.bindPopup(`<div style="text-align:center;"><b>${nEn}</b><br>${nAr}</div>`);
                    }
                }
            });
        }
        layer.addTo(map);
        layers[name] = layer;
        
        // Add to Opacity Box
        createOpacityControl(name);
        
        // Add to Static Legend
        createLegendItem(name, type, style, emoji);
        
        if (name === "Ramallah Boundary") map.fitBounds(layer.getBounds());
    });
}

function createOpacityControl(name) {
    let html = `
        <div class="opacity-item">
            <div style="margin-bottom:3px;">${name}</div>
            <input type="range" class="opacity-slider" min="0" max="1" step="0.1" value="1" 
                   oninput="changeLayerOpacity('${name}', this.value)">
        </div>`;
    $("#opacity-content").append(html);
}

function changeLayerOpacity(name, val) {
    let l = layers[name];
    if (!l) return;
    l.eachLayer(function(inner) {
        if (inner.setOpacity) inner.setOpacity(val);
        if (inner.setStyle) inner.setStyle({ opacity: val, fillOpacity: val * 0.4 });
    });
}

function createLegendItem(name, type, style, emoji) {
    let sym = type === 'point' ? `<span>${emoji}</span>` : `<div class="symbol-poly" style="background:${style.fillColor || style.color}"></div>`;
    $("#static-legend-items").append(`<div class="legend-item">${sym} <span style="margin-left:5px;">${name}</span></div>`);
}

// Loading Data
addLayer("Schools.geojson", "Schools", "point", null, "🏫");
addLayer("Wells.geojson", "Wells", "point", null, "💧");
addLayer("Quarries.geojson", "Quarries", "point", null, "⛏️");
addLayer("Roads.geojson", "Roads", "line", { color: "black", weight: 1 });
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db", weight: 2 });
addLayer("Annexation_Wall.geojson", "Annexation Wall", "line", { color: "#555", weight: 3, dashArray: '5,10' });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillColor: "#8fd19e" });
addLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "poly", { color: "orange", fillColor: "#ffb347" });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillColor: "#ff6666" });
addLayer("Ramallah.geojson", "Ramallah Boundary", "poly", { color: "black", weight: 2, fillOpacity: 0.1 });

// --- Analysis Tools Re-activated ---
function runSmartAdvisor() {
    clearAnalysis(); hideExceptBoundary();
    $("#dynamic-items").html("<b>Advisor:</b> High Potential Areas (Green)");
    if (layers["Settlements"]) {
        let buff = turf.buffer(layers["Settlements"].toGeoJSON(), 0.3, {units:'kilometers'});
        L.geoJson(buff, {style: {color:'red', fillOpacity:0.5}}).bindPopup("Exclusion Zone").addTo(analysisGroup);
    }
}

function runHazardScanner() {
    clearAnalysis(); hideExceptBoundary();
    $("#dynamic-items").html("<b>Hazard:</b> Flood & Quarry Risk Zones");
    if (layers["Streams"]) {
        let f = turf.buffer(layers["Streams"].toGeoJSON(), 0.15, {units:'kilometers'});
        L.geoJson(f, {style: {color:'orange', fillOpacity:0.5}}).bindPopup("Flood Danger").addTo(analysisGroup);
    }
}

function runIsolationScanner() {
    clearAnalysis(); hideExceptBoundary();
    if (layers["Closed Areas"]) {
        L.geoJson(layers["Closed Areas"].toGeoJSON(), {style: {color:'purple', fillOpacity:0.6}}).bindPopup("Isolated Land").addTo(analysisGroup);
    }
}

// --- Story Mode ---
const storySteps = [
    { title: "Urban vs Settlement", text: "Notice the proximity of Settlements to City Boundaries.", center: [31.91, 35.26], zoom: 14 },
    { title: "Water Scarcity", text: "Strategic water wells located near industrial zones.", center: [31.88, 35.23], zoom: 14 }
];

function startStory() { clearAnalysis(); currentStep = 0; $("#story-panel").fadeIn(); updateStory(); }
function updateStory() {
    let s = storySteps[currentStep];
    $("#story-title").text(s.title); $("#story-text").text(s.text);
    map.flyTo(s.center, s.zoom);
}
function nextStep() { if(currentStep < storySteps.length-1) {currentStep++; updateStory();} }
function prevStep() { if(currentStep > 0) {currentStep--; updateStory();} }
function closeStory() { $("#story-panel").fadeOut(); clearAnalysis(); }

function clearAnalysis() {
    analysisGroup.clearLayers();
    for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]);
    $("#dynamic-items").html("No analysis active...");
}
function hideExceptBoundary() { for (let k in layers) if (k !== "Ramallah Boundary") map.removeLayer(layers[k]); }

</script>
</body>
</html>
