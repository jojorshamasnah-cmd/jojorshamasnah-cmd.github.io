<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Suite</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-basemap { background: #27ae60; }
        .btn-hazard { background: #d35400; }
        .btn-isolation { background: #8e44ad; }
        .btn-equity { background: #16a085; } 
        .btn-story { background: #2980b9; } 
        .btn-measure { background: #f39c12 !important; }
        .btn-stats { background: #2ecc71 !important; }
        .btn-search { background: #34495e !important; }
        .btn-eco { background: #1abc9c !important; }
        .btn-clear { background: #e74c3c; }
        .btn-tool:hover { transform: translateY(-2px); opacity: 0.9; }

        #search-container { position: absolute; top: 70px; left: 60px; z-index: 1000; display: none; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 250px; }
        #search-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: right; }

        #measure-output { position: absolute; top: 15px; right: 20px; z-index: 2000; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; border-left: 5px solid #f39c12; font-weight: bold; direction: rtl; max-width: 250px; }
        #stats-panel { position: absolute; bottom: 30px; right: 20px; width: 300px; background: white; padding: 15px; border-radius: 12px; z-index: 3000; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.3); border-top: 5px solid #2ecc71; direction: rtl; }
        #story-panel { position: absolute; top: 80px; right: 20px; width: 320px; background: rgba(255, 255, 255, 0.95); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 3000; display: none; padding: 20px; border-top: 5px solid #2980b9; direction: rtl; }
        .story-nav { display: flex; justify-content: space-between; margin-top: 15px; }
        .btn-nav { background: #34495e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        #legend-box { position: absolute; bottom: 85px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; border: 1px solid #ccc; overflow: hidden; direction: rtl; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        #legend-content { padding: 15px; max-height: 400px; overflow-y: auto; }
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 12px 0 6px 0; border-bottom: 1px solid #eee; padding-bottom: 3px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 11px; }
        .symbol-poly { width: 16px; height: 10px; border: 1px solid #555; margin-left: 8px; flex-shrink: 0; }
        .symbol-line { width: 20px; height: 3px; margin-left: 8px; flex-shrink: 0; }
        .symbol-icon { font-size: 14px; margin-left: 8px; width: 18px; text-align: center; }
        .map-icon { font-size: 14px; text-shadow: 0 0 3px white; text-align: center; }
    </style>
</head>
<body>

<div id="advisor-ui">
    <button class="btn-tool btn-basemap" onclick="toggleBaseMap()">🗺️ الخريطة</button>
    <button class="btn-tool btn-measure" onclick="toggleMeasureTool()">📏 القياس</button>
    <button class="btn-tool btn-stats" onclick="runLiveStats()">📊 إحصائيات</button>
    <button class="btn-tool btn-search" onclick="toggleSearch()">🔍 بحث</button>
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 المستشار</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ مخاطر</button>
    <button class="btn-tool btn-isolation" onclick="runIsolationScanner()">🔍 عزل</button>
    <button class="btn-tool btn-equity" onclick="runServiceEquity()">⚖️ الخدمات</button>
    <button class="btn-tool btn-eco" onclick="runEcoBuffer()">🌳 بيئة</button>
    <button class="btn-tool btn-story" onclick="startStory()">📖 قصة</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 استعادة</button>
</div>

<div id="search-container">
    <input type="text" id="search-input" placeholder="ابحث عن مكان أو معلم..." onkeyup="executeSearch()">
    <div id="search-results" style="font-size: 11px; margin-top: 5px; color: #666; text-align: right;"></div>
</div>

<div id="measure-output">النتيجة: <br><span id="measure-res" style="color:#d35400;">حدد نقطة للبدء</span></div>

<div id="stats-panel">
    <h4 style="margin:0 0 10px 0; color:#2c3e50; text-align:center;">إحصائيات رام الله المكانية</h4>
    <canvas id="statsChart" style="max-height: 200px;"></canvas>
    <div id="stats-summary" style="font-size: 11px; margin-top: 10px; color: #555;"></div>
    <button onclick="$('#stats-panel').fadeOut()" style="margin-top:10px; width:100%; cursor:pointer; border:none; background:#eee; padding:5px; border-radius:5px;">إغلاق</button>
</div>

<div id="story-panel">
    <h3 id="story-title" style="margin-top:0; color:#2980b9;"></h3>
    <p id="story-text" style="font-size: 14px; line-height: 1.6; color: #444;"></p>
    <div class="story-nav">
        <button onclick="prevStep()" class="btn-nav">السابق</button>
        <button onclick="nextStep()" class="btn-nav">التالي</button>
    </div>
    <button onclick="closeStory()" style="margin-top:15px; width:100%; border:none; background:none; cursor:pointer; color:#e74c3c; font-weight:bold;">خروج من القصة</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div id="legend-title" onclick="$('#legend-content').slideToggle()">
        <span>📊 مفتاح الخريطة</span> <span>▼</span>
    </div>
    <div id="legend-content">
        <div id="analysis-legend-section">
            <div class="legend-section">نتائج التحليل</div>
            <div id="dynamic-items" style="color:gray; font-style:italic;">لا توجد أداة مفعلة...</div>
        </div>
        <div class="legend-section">الطبقات الأساسية</div>
        <div class="legend-item"><span class="symbol-icon">🏫</span> المدارس</div>
        <div class="legend-item"><span class="symbol-icon">💧</span> الآبار</div>
        <div class="legend-item"><span class="symbol-icon">⛏️</span> الكسارات</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> الطرق</div>
        <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> الأودية</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555; border-top: 2px dashed #999;"></span> جدار الضم والتوسع</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> أراضي زراعية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> مناطق مغلقة</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> مناطق مبنية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> مخططات هيكلية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> مستوطنات</div>
        <div class="legend-item"><span class="symbol-poly" style="border: 2px solid black; background:none;"></span> حدود المدينة</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
var osmLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var isBaseMapVisible = true;
var layers = {};
var analysisGroup = L.layerGroup().addTo(map);
var currentStep = 0;
var statsChartInstance = null;

// --- إعداد أداة القياس ---
var measureGroup = new L.FeatureGroup().addTo(map);
var isMeasureActive = false;
var drawControl = new L.Control.Draw({
    edit: { featureGroup: measureGroup },
    draw: { polygon: true, polyline: true, rectangle: true, circle: false, marker: false, circlemarker: false }
});

L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

function toggleBaseMap() {
    if (isBaseMapVisible) map.removeLayer(osmLayer);
    else osmLayer.addTo(map);
    isBaseMapVisible = !isBaseMapVisible;
}

function toggleMeasureTool() {
    isMeasureActive = !isMeasureActive;
    if (isMeasureActive) {
        clearAnalysis(); hideExceptBoundary();
        map.addControl(drawControl);
        $("#measure-output").fadeIn();
    } else {
        restoreAllLayers();
        map.removeControl(drawControl);
        $("#measure-output").fadeOut();
        measureGroup.clearLayers();
    }
}

map.on(L.Draw.Event.CREATED, function (e) {
    var layer = e.layer; 
    measureGroup.addLayer(layer);
    let output = "";
    if (e.layerType === 'polyline') {
        let coords = layer.getLatLngs(); 
        let length = 0;
        for (let i = 0; i < coords.length - 1; i++) length += coords[i].distanceTo(coords[i+1]);
        let km = (length / 1000).toFixed(2);
        output = `إجمالي طول المسار المحدد هو: ${km} كيلومتر`;
    } else if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
        let latlngs = layer.getLatLngs()[0];
        let area = L.GeometryUtil.geodesicArea(latlngs);
        let km2 = (area / 1000000).toFixed(2);
        let dunum = (area / 1000).toFixed(1);
        output = `المساحة المحصورة: ${km2} كم² <br>(ما يعادل ${dunum} دونم تقريباً)`;
    }
    $("#measure-res").html(output);
});

function addLayer(file, name, type, style, emoji) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, { 
                pointToLayer: (f, latlng) => L.marker(latlng, { icon: L.divIcon({ html: emoji, className: 'map-icon', iconSize: [18,18] }) }) 
            });
        } else {
            layer = L.geoJson(data, { 
                style: style,
                onEachFeature: function(feature, layer) {
                    if (name === "Ramallah Boundary") {
                        let nameAr = feature.properties.CommunityN || "غير معروف";
                        layer.bindPopup(`<div style="text-align:center;"><b style="font-size:14px; color:#2c3e50;">${nameAr}</b></div>`);
                    }
                }
            });
        }
        layer.addTo(map);
        layers[name] = layer;
        if (name === "Ramallah Boundary") map.fitBounds(layer.getBounds(), { padding: [30, 30] });
    });
}

addLayer("Schools.geojson", "Schools", "point", null, "🏫");
addLayer("Wells.geojson", "Wells", "point", null, "💧");
addLayer("Quarries.geojson", "Quarries", "point", null, "⛏️");
addLayer("Roads.geojson", "Roads", "line", { color: "black", weight: 1.5 });
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db", weight: 2 });
addLayer("Annexation_Wall.geojson", "Annexation Wall", "line", { color: "#555", weight: 3, dashArray: '5, 10' });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillColor: "#8fd19e", fillOpacity: 0.2 });
addLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "poly", { color: "orange", fillColor: "#ffb347", fillOpacity: 0.2 });
addLayer("Built_up.geojson", "Built-up Areas", "poly", { color: "brown", fillColor: "#c49a6c", fillOpacity: 0.2 });
addLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "poly", { color: "purple", fillColor: "#af7ac5", fillOpacity: 0.2 });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillColor: "#ff6666", fillOpacity: 0.2 });
addLayer("Temperature.geojson", "Temperature Zones", "poly", { color: "blue", fillColor: "#87ceeb", fillOpacity: 0.1 });
addLayer("Ramallah.geojson", "Ramallah Boundary", "poly", { color: "black", weight: 2, fillOpacity: 0.1 });

// --- أداة العزل (Isolation Scanner) مع تحديث الليجند ---
function runIsolationScanner() {
    clearAnalysis(); 
    hideExceptBoundary();
    
    // تحديث الليجند ليظهر التحليل المفعّل
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#8e44ad"></span> أراضي معزولة خلف الجدار</div>`;
    
    if (layers["Closed Areas"]) {
        L.geoJson(layers["Closed Areas"].toGeoJSON(), { 
            style: { color: '#8e44ad', fillColor: '#8e44ad', fillOpacity: 0.7 },
            onEachFeature: (f, l) => {
                let areaSqKm = (turf.area(f) / 1000000).toFixed(2);
                l.bindPopup(`<b>منطقة معزولة</b><br>المساحة: ${areaSqKm} كم²`);
            }
        }).addTo(analysisGroup);
        
        if (analysisGroup.getLayers().length > 0) map.fitBounds(analysisGroup.getBounds());
    }
}

function runHazardScanner() {
    clearAnalysis(); 
    hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> خطر فيضان</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e67e22"></span> أثر بيئي (كسارات)</div>`;
    
    if (layers["Streams"]) {
        let streamBuffer = turf.buffer(layers["Streams"].toGeoJSON(), 0.15, {units:'kilometers'});
        L.geoJson(streamBuffer, {style:{color:'#922b21', fillColor:'#e74c3c', fillOpacity:0.6}})
        .bindPopup("<b>تحذير فيضان</b>").addTo(analysisGroup);
    }
    if (layers["Quarries"]) {
        let quarryBuffer = turf.buffer(layers["Quarries"].toGeoJSON(), 0.5, {units:'kilometers'});
        L.geoJson(quarryBuffer, {style:{color:'#d35400', fillColor:'#e67e22', fillOpacity:0.5}})
        .bindPopup("<b>أثر بيئي</b>").addTo(analysisGroup);
    }
}

function runSmartAdvisor() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> إمكانيات زراعية عالية</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> منطقة استبعاد (مستوطنات)</div>`;

    if (layers["Settlements"]) {
        let buff = turf.buffer(layers["Settlements"].toGeoJSON(), 0.3, {units:'kilometers'});
        L.geoJson(buff, { style: {color:'#c0392b', fillColor:'#e74c3c', fillOpacity:0.7} })
        .bindPopup("<b>منطقة استبعاد</b>").addTo(analysisGroup);
    }
}

function runServiceEquity() {
    clearAnalysis(); hideExceptBoundary();
    document.getElementById("dynamic-items").innerHTML = `<div class="legend-item"><span class="symbol-poly" style="background:rgba(231, 76, 60, 0.6)"></span> فجوة في الخدمات</div>`;
    let pts = [];
    if (layers["Schools"]) pts.push(...layers["Schools"].toGeoJSON().features);
    if (layers["Wells"]) pts.push(...layers["Wells"].toGeoJSON().features);
    if (pts.length > 0 && layers["Ramallah Boundary"]) {
        let buffered = turf.buffer(turf.featureCollection(pts), 1.5, {units: 'kilometers'});
        let gap = turf.difference(layers["Ramallah Boundary"].toGeoJSON().features[0], turf.dissolve(buffered));
        if (gap) {
            L.geoJson(gap, { style: { color: '#e74c3c', fillOpacity: 0.5, weight: 1, dashArray: '5,5' } })
            .bindPopup("<b>فجوة خدماتية</b>").addTo(analysisGroup);
        }
    }
}

function startStory() { clearAnalysis(); currentStep = 0; $("#story-panel").fadeIn(); updateStoryScene(); }
function updateStoryScene() {
    const storySteps = [
        { title: "المشهد 1", text: "التوسع العمراني", center: [31.910, 35.260], zoom: 14, visibleLayers: ["Settlements", "Master Plans"] },
        { title: "المشهد 2", text: "الجدار الفاصل", center: [31.940, 35.130], zoom: 14, visibleLayers: ["Annexation Wall", "Closed Areas"] }
    ];
    const step = storySteps[currentStep];
    $("#story-title").text(step.title); $("#story-text").text(step.text);
    map.flyTo(step.center, step.zoom);
    for (let k in layers) {
        if (step.visibleLayers.includes(k) || k === "Ramallah Boundary") { if (!map.hasLayer(layers[k])) map.addLayer(layers[k]); }
        else { map.removeLayer(layers[k]); }
    }
}
function nextStep() { if (currentStep < 1) { currentStep++; updateStoryScene(); } }
function prevStep() { if (currentStep > 0) { currentStep--; updateStoryScene(); } }
function closeStory() { $("#story-panel").fadeOut(); restoreAllLayers(); }

function runEcoBuffer() {
    clearAnalysis(); hideExceptBoundary();
    if (layers["Streams"]) {
        L.geoJson(turf.buffer(layers["Streams"].toGeoJSON(), 0.2, {units: 'kilometers'}), { style: { color: '#1abc9c', fillOpacity: 0.4 } }).addTo(analysisGroup);
    }
}

function runLiveStats() {
    $("#stats-panel").fadeIn();
    let agri = 0, built = 0;
    if (layers["Agricultural Land"]) layers["Agricultural Land"].eachLayer(l => agri += turf.area(l.feature));
    if (layers["Built-up Areas"]) layers["Built-up Areas"].eachLayer(l => built += turf.area(l.feature));
    if (statsChartInstance) statsChartInstance.destroy();
    statsChartInstance = new Chart(document.getElementById('statsChart').getContext('2d'), {
        type: 'pie', data: { labels: ['زراعي', 'مبني'], datasets: [{ data: [(agri/1e6).toFixed(1), (built/1e6).toFixed(1)], backgroundColor: ['#2ecc71', '#e67e22'] }] }
    });
}

function toggleSearch() { $("#search-container").fadeToggle(); $("#search-input").val("").focus(); }
function executeSearch() {
    let q = $("#search-input").val().toLowerCase();
    analysisGroup.clearLayers();
    if (q.length < 2) return;
    for (let k in layers) {
        layers[k].eachLayer(l => {
            if (JSON.stringify(l.feature.properties).toLowerCase().includes(q)) {
                L.geoJson(l.feature, { style: { color: 'yellow', weight: 5, fillOpacity: 0.8 } }).addTo(analysisGroup);
            }
        });
    }
}

function hideExceptBoundary() { for (let k in layers) if (k !== "Ramallah Boundary") map.removeLayer(layers[k]); }
function restoreAllLayers() { for (let k in layers) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]); }
function clearAnalysis() {
    analysisGroup.clearLayers(); $("#story-panel, #stats-panel, #search-container").hide();
    restoreAllLayers();
    document.getElementById("dynamic-items").innerHTML = "لا توجد أداة مفعلة...";
}
</script>
</body>
</html>
