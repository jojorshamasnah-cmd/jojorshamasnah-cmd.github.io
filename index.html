<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Tool</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* واجهة الأزرار العلوي */
        #advisor-ui { position: absolute; top: 15px; left: 60px; z-index: 1000; display: flex; gap: 10px; }
        .btn-tool { background: #2c3e50; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .btn-hazard { background: #d35400; }
        .btn-clear { background: #7f8c8d; }
        .btn-tool:hover { transform: translateY(-2px); opacity: 0.9; }

        /* أسطورة الخريطة (Legend) */
        #legend-box { position: absolute; bottom: 30px; left: 15px; background: white; border-radius: 12px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; overflow: hidden; border: 1px solid #ccc; }
        #legend-title { font-weight: bold; padding: 12px; background: #f8f9fa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        #legend-content { padding: 15px; max-height: 450px; overflow-y: auto; display: none; } /* مخفية عند البداية */
        
        .legend-section { font-size: 13px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .symbol-poly { width: 20px; height: 12px; border: 1px solid #555; margin-right: 10px; }
        .symbol-line { width: 25px; height: 3px; margin-right: 10px; }

        /* صندوق الشفافية */
        #opacity-box { position: absolute; right: 15px; bottom: 30px; background: white; padding: 15px; border-radius: 12px; width: 230px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 2000; }
        select, input[type=range] { width: 100%; margin-top: 10px; }
    </style>
</head>

<body>

<div id="advisor-ui">
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Smart Advisor</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard Scanner</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Clear</button>
</div>

<div id="map"></div>

<div id="opacity-box">
    <div style="font-weight:bold; text-align:center;">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title" onclick="toggleLegend()">
        <span>📊 Map Legend</span> <span id="arrow">▼</span>
    </div>
    <div id="legend-content">
        <div class="legend-section">Analysis Results</div>
        <div id="dynamic-items" style="color:gray; font-style:italic; margin-bottom:15px;">No tool selected...</div>

        <div class="legend-section">Base Map Layers</div>
        <div class="legend-item"><span style="font-size:16px; margin-right:10px;">🏫</span> Schools</div>
        <div class="legend-item"><span style="font-size:16px; margin-right:10px;">💧</span> Wells</div>
        <div class="legend-item"><span style="font-size:16px; margin-right:10px;">⛏️</span> Quarries</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> Streams (Wadis)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-poly" style="border: 1.5px solid black; background:none;"></span> City Boundary</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = {};
var analysisGroup = L.layerGroup().addTo(map);

// قائمة الطبقات مغلقة افتراضياً (collapsed: true)
var overlayControl = L.control.layers(null, null, { collapsed: true }).addTo(map);

function toggleLegend() {
    var content = document.getElementById("legend-content");
    var arrow = document.getElementById("arrow");
    content.style.display = (content.style.display === "none" || content.style.display === "") ? "block" : "none";
    arrow.innerHTML = content.style.display === "none" ? "▼" : "▲";
}

function getIcon(name) {
    let html = name === "Schools" ? "🏫" : name === "Wells" ? "💧" : "⛏️";
    return L.divIcon({ html: html, className: '', iconSize: [25, 25], iconAnchor: [12, 12] });
}

function addLayer(file, name, type, style) {
    $.getJSON(file, function(data) {
        let layer;
        if (type === "point") {
            layer = L.geoJson(data, {
                pointToLayer: (feature, latlng) => L.marker(latlng, { icon: getIcon(name) })
            });
        } else {
            layer = L.geoJson(data, { style: style });
        }
        layer.addTo(map);
        layers[name] = layer;
        overlayControl.addOverlay(layer, name);
        $("#opacity-select").append(`<option value="${name}">${name}</option>`);
    });
}

// تحميل الطبقات الـ 13
addLayer("Schools.geojson", "Schools", "point");
addLayer("Wells.geojson", "Wells", "point");
addLayer("Quarries.geojson", "Quarries", "point");
addLayer("Roads.geojson", "Roads", "line", { color: "black", weight: 2 });
addLayer("Streams.geojson", "Streams", "line", { color: "#3498db", weight: 2 });
addLayer("Annexation_Wall.geojson", "Annexation Wall", "line", { color: "#555", weight: 3, dashArray: '5, 10' });
addLayer("Agricultural_Land.geojson", "Agricultural Land", "poly", { color: "green", fillColor: "#8fd19e", fillOpacity: 0.3 });
addLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "poly", { color: "orange", fillColor: "#ffb347", fillOpacity: 0.3 });
addLayer("Built_up.geojson", "Built-up Areas", "poly", { color: "brown", fillColor: "#c49a6c", fillOpacity: 0.3 });
addLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "poly", { color: "purple", fillColor: "#af7ac5", fillOpacity: 0.3 });
addLayer("Settlements.geojson", "Settlements", "poly", { color: "red", fillColor: "#ff6666", fillOpacity: 0.3 });
addLayer("Temperature.geojson", "Temperature Zones", "poly", { color: "blue", fillColor: "#87ceeb", fillOpacity: 0.1 });
addLayer("Ramallah.geojson", "Ramallah Boundary", "poly", { color: "black", weight: 2, fillOpacity: 0 });

// --- 🧠 وظيفة المستشار الذكي (أخضر، أصفر، أحمر) ---
function runSmartAdvisor() {
    clearAnalysis();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> High Potential (Best)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> Moderate Potential (Agri)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:red"></span> Exclusion Zone (Settlement)</div>
    `;

    // 1. الأحمر: المستوطنات
    if (layers["Settlements"]) {
        L.geoJson(layers["Settlements"].toGeoJSON(), { 
            style: { color: "darkred", fillColor: "red", fillOpacity: 0.6 } 
        }).addTo(analysisGroup);
    }

    // 2. الأصفر والأخضر: تحليل الأراضي والحرارة
    if (layers["Agricultural Land"] && layers["Temperature Zones"]) {
        let agriJSON = layers["Agricultural Land"].toGeoJSON();
        let tempJSON = layers["Temperature Zones"].toGeoJSON();
        
        // رسم الأصفر أولاً (كل الأراضي الزراعية الجيدة)
        L.geoJson(agriJSON, {
            style: { color: "#d4ac0d", fillColor: "#f1c40f", fillOpacity: 0.4, weight: 1 },
            filter: function(f) { return f.properties.Agricult_1 && f.properties.Agricult_1.includes("High"); }
        }).addTo(analysisGroup);

        // رسم الأخضر (تقاطع الزراعة مع الحرارة المثالية)
        let highFeatures = [];
        agriJSON.features.forEach(land => {
            if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                tempJSON.features.forEach(t => {
                    if (t.properties.MEAN_ANNUA === "19 - 21") {
                        let intersect = turf.intersect(land, t);
                        if (intersect) highFeatures.push(intersect);
                    }
                });
            }
        });

        if (highFeatures.length > 0) {
            L.geoJson(turf.featureCollection(highFeatures), {
                style: { color: "#1d8348", fillColor: "#2ecc71", fillOpacity: 0.8, weight: 1.5 }
            }).addTo(analysisGroup);
        }
    }
}

// --- ⚠️ وظيفة ماسح الخطر (Hazard Scanner) ---
function runHazardScanner() {
    clearAnalysis();
    document.getElementById("dynamic-items").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#c0392b"></span> Flood Risk (150m)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e67e22"></span> Quarry Impact (500m)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#96281b"></span> Heat Stress (21-23°C)</div>
    `;

    if (layers["Streams"]) {
        let buffer = turf.buffer(layers["Streams"].toGeoJSON(), 0.15, { units: 'kilometers' });
        L.geoJson(buffer, { style: { color: "#c0392b", fillColor: "#e74c3c", fillOpacity: 0.5 } }).addTo(analysisGroup);
    }
    if (layers["Quarries"]) {
        let qBuffer = turf.buffer(layers["Quarries"].toGeoJSON(), 0.5, { units: 'kilometers' });
        L.geoJson(qBuffer, { style: { color: "#d35400", fillColor: "#e67e22", fillOpacity: 0.4 } }).addTo(analysisGroup);
    }
    if (layers["Temperature Zones"]) {
        L.geoJson(layers["Temperature Zones"].toGeoJSON(), {
            style: { color: "#96281b", fillColor: "#c0392b", fillOpacity: 0.3, weight: 1 },
            filter: function(f) { return f.properties.MEAN_ANNUA === "21 - 23"; }
        }).addTo(analysisGroup);
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers();
    document.getElementById("dynamic-items").innerHTML = "No tool selected...";
}

$("#opacity-slider").on("input", function() {
    let layerName = $("#opacity-select").val();
    if (layers[layerName]) {
        layers[layerName].setStyle({ opacity: this.value, fillOpacity: this.value });
    }
});
</script>
</body>
</html>
