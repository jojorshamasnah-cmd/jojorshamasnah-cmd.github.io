<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Full Advisor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; }

        #advisor-ui {
            position: absolute; top: 10px; left: 50px; z-index: 1000; display: flex; gap: 5px;
        }

        .btn-advisor {
            background: #2c3e50; color: white; border: none; padding: 10px 15px;
            border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-clear { background: #95a5a6; }
        .btn-advisor:hover { opacity: 0.9; }

        #legend-box {
            position: absolute; bottom: 45px; left: 10px; background: white;
            padding: 10px 14px; border-radius: 10px; width: 240px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 9998;
        }

        #legend-title { font-weight: bold; text-align: center; cursor: pointer; }
        #legend-content { display: none; margin-top: 8px; font-size: 13px; max-height: 400px; overflow-y: auto; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .emoji { font-size: 18px; width: 25px; margin-right: 6px; }
        .symbol-line { width: 30px; height: 4px; margin-right: 6px; }
        .symbol-poly { width: 22px; height: 12px; border: 1px solid #000; margin-right: 6px; }

        #opacity-box {
            position: absolute; right: 10px; bottom: 45px; background: white;
            padding: 12px; border-radius: 10px; width: 220px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 9999;
        }

        select, input[type=range] { width: 100%; margin-top: 6px; }
    </style>
</head>

<body>

<div id="advisor-ui">
    <button class="btn-advisor" onclick="runSmartAdvisor()">🧠 Smart Advisor</button>
    <button class="btn-advisor btn-clear" onclick="clearAnalysis()">🧹 Clear Analysis</button>
</div>

<div id="map"></div>

<div id="opacity-box">
    <div style="font-weight:bold; text-align:center;">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title">Legend ▼</div>
    <div id="legend-content">
        <div style="font-weight: bold; color: #2c3e50; margin-bottom: 5px;">Advisor Results:</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#27ae60"></span> Best Investment (Green)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> Moderate Potential (Yellow)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> Exclusion Zones (Red)</div>
        <hr>
        <div style="font-weight: bold; color: #2c3e50; margin-bottom: 5px;">Map Layers:</div>
        <div class="legend-item"><span class="emoji">🏫</span> Schools</div>
        <div class="legend-item"><span class="emoji">💧</span> Wells</div>
        <div class="legend-item"><span class="emoji">⛏️</span> Quarries</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
        <div class="legend-item"><span class="symbol-line" style="background:#0077ff"></span> Streams</div>
        <div class="legend-item"><span class="symbol-line" style="background:#555"></span> Annexation Wall</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ffb347"></span> Closed Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#c49a6c"></span> Built-up Areas</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#af7ac5"></span> Master Plans</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#87ceeb"></span> Temperature Zones</div>
        <div class="legend-item"><span class="symbol-poly" style="border: 2px solid black; background: none;"></span> Ramallah Boundary</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = { points: {}, lines: {}, polys: {} };
var analysisGroup = L.layerGroup().addTo(map); 
var control = L.control.layers({}, {}, { collapsed: false }).addTo(map);

function getPointIcon(type) {
    let icon = type === "Schools" ? "🏫" : type === "Wells" ? "💧" : type === "Quarries" ? "⛏️" : "•";
    return L.divIcon({ html: icon, className: "", iconSize: [25, 25], iconAnchor: [12, 12] });
}

function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function (data) {
        var layer;
        if (group === "points") {
            layer = L.geoJson(data, {
                pointToLayer: function (f, l) { return L.marker(l, { icon: getPointIcon(name) }); }
            }).addTo(map);
        } else {
            layer = L.geoJson(data, { style: styleObj }).addTo(map);
        }
        layers[group][name] = layer;
        control.addOverlay(layer, name);
        document.getElementById("opacity-select").innerHTML += `<option value="${name}">${name}</option>`;
    });
}

function runSmartAdvisor() {
    clearAnalysis();
    
    // RED: Exclusion
    if (layers.polys["Settlements"]) {
        L.geoJson(layers.polys["Settlements"].toGeoJSON(), { style: { color: "red", fillColor: "red", fillOpacity: 0.6 } })
        .bindPopup("<b>Exclusion Zone</b><br>Settlement Area.").addTo(analysisGroup);
    }
    if (layers.polys["Closed Areas"]) {
        L.geoJson(layers.polys["Closed Areas"].toGeoJSON(), { style: { color: "red", fillColor: "red", fillOpacity: 0.4 } })
        .bindPopup("<b>Exclusion Zone</b><br>Closed/Military Area.").addTo(analysisGroup);
    }

    // GREEN & YELLOW
    if (layers.polys["Agricultural Land"] && layers.polys["Temperature Zones"]) {
        let agri = layers.polys["Agricultural Land"].toGeoJSON();
        let temp = layers.polys["Temperature Zones"].toGeoJSON();
        let high = []; let mod = [];

        agri.features.forEach(land => {
            let isHighAgri = land.properties.Agricult_1 && land.properties.Agricult_1.includes("High");
            temp.features.forEach(t => {
                let isIdealTemp = t.properties.MEAN_ANNUA === "19 - 21";
                let intersect = turf.intersect(land, t);
                if (intersect) {
                    if (isHighAgri && isIdealTemp) high.push(intersect);
                    else if (isHighAgri || isIdealTemp) mod.push(intersect);
                }
            });
        });

        if (high.length > 0) L.geoJson(turf.featureCollection(high), { style: { color: "#27ae60", fillColor: "#2ecc71", fillOpacity: 0.8 } })
            .bindPopup("<b>Best Choice</b><br>Optimal conditions.").addTo(analysisGroup);
        if (mod.length > 0) L.geoJson(turf.featureCollection(mod), { style: { color: "#f1c40f", fillColor: "#fbc531", fillOpacity: 0.6 } })
            .bindPopup("<b>Moderate Choice</b><br>Check details.").addTo(analysisGroup);
    }
    alert("Analysis Applied: Green (Best), Yellow (Moderate), Red (Exclusion)");
}

function clearAnalysis() { analysisGroup.clearLayers(); }

// --- LOAD ALL 13 LAYERS ---
loadLayer("Schools.geojson", "Schools", "points");
loadLayer("Wells.geojson", "Wells", "points");
loadLayer("Quarries.geojson", "Quarries", "points");

loadLayer("Roads.geojson", "Roads", "lines", { color:"black", weight:2 });
loadLayer("Streams.geojson", "Streams", "lines", { color:"#0077ff", weight:2 });
loadLayer("Annexation_Wall.geojson", "Annexation Wall", "lines", { color:"#555", weight:3 });

loadLayer("Agricultural_Land.geojson", "Agricultural Land", "polys", { color:"green", fillColor:"#8fd19e", fillOpacity:0.5 });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", { color:"orange", fillColor:"#ffb347", fillOpacity:0.5 });
loadLayer("Built_up.geojson", "Built-up Areas", "polys", { color:"brown", fillColor:"#c49a6c", fillOpacity:0.5 });
loadLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "polys", { color:"purple", fillColor:"#af7ac5", fillOpacity:0.5 });
loadLayer("Settlements.geojson", "Settlements", "polys", { color:"red", fillColor:"#ff6666", fillOpacity:0.5 });
loadLayer("Temperature.geojson", "Temperature Zones", "polys", { color:"blue", fillColor:"#87ceeb", fillOpacity:0.4 });
loadLayer("Ramallah.geojson", "Ramallah Boundary", "polys", { color:"black", weight: 2, fillOpacity:0 });

document.getElementById("opacity-slider").oninput = function () {
    let s = document.getElementById("opacity-select").value;
    for (let g in layers) { if (layers[g][s]) layers[g][s].setStyle({ opacity: this.value, fillOpacity: this.value }); }
};

document.getElementById("legend-title").onclick = function () {
    let c = document.getElementById("legend-content");
    c.style.display = c.style.display === "none" ? "block" : "none";
    this.innerHTML = c.style.display === "none" ? "Legend ▼" : "Legend ▲";
};
</script>
</body>
</html>
