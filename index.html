<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Edition</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; }
        #advisor-control { position: absolute; top: 10px; left: 50px; z-index: 1000; display: flex; gap: 10px; }
        .btn-advisor { background: #2c3e50; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-clear { background: #95a5a6; }
        .btn-advisor:hover { background: #e67e22; }
        
        #legend-box { position: absolute; bottom: 45px; left: 10px; background: white; padding: 10px 14px; border-radius: 10px; width: 230px; box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 9998; }
        #opacity-box { position: absolute; right: 10px; bottom: 45px; background: white; padding: 12px; border-radius: 10px; width: 220px; box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 9999; }
        .symbol-poly { width: 22px; height: 12px; border: 1px solid #000; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>

<div id="advisor-control">
    <button class="btn-advisor" onclick="runSmartAdvisor()">🧠 تشغيل تحليل الاستثمار</button>
    <button class="btn-advisor btn-clear" onclick="clearAnalysis()">🧹 مسح التحليل</button>
</div>

<div id="map"></div>

<div id="opacity-box">
    <div style="font-weight:bold; text-align:center; margin-bottom:8px;">شفافية الطبقات</div>
    <select id="opacity-select"><option value="" disabled selected>اختر الطبقة</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div style="font-weight: bold; text-align: center;">دليل المستشار الذكي</div>
    <div id="legend-content">
        <div style="margin-top: 5px;"><span class="symbol-poly" style="background:gold"></span> مناطق واعدة (استثمار)</div>
        <div style="margin-top: 5px;"><span class="symbol-poly" style="background:red; opacity: 0.6;"></span> مناطق استبعاد (خطر)</div>
        <hr>
        <div style="font-size: 12px;">✅ أراضي عالية القيمة</div>
        <div style="font-size: 12px;">✅ حرارة (19-21)</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = { points: {}, lines: {}, polys: {} };
var analysisGroup = L.layerGroup().addTo(map); // مجموعة خاصة للتحليل لكي لا تؤثر على الطبقات الأصلية
var control = L.control.layers({}, {}, { collapsed: false }).addTo(map);

function loadLayer(file, name, group, styleObj, isPoint = false) {
    $.getJSON(file, function (data) {
        var layer = L.geoJson(data, {
            style: styleObj,
            pointToLayer: isPoint ? function(feature, latlng) { 
                return L.marker(latlng, {icon: L.divIcon({html: '📍', className: ''})}); 
            } : null
        }).addTo(map);

        layers[group][name] = layer;
        control.addOverlay(layer, name);
        $("#opacity-select").append(`<option value="${name}">${name}</option>`);
    });
}

function runSmartAdvisor() {
    analysisGroup.clearLayers(); // نمسح التحليل القديم فقط وليس الخريطة بالكامل
    
    // 1. إظهار مناطق الاستبعاد باللون الأحمر (بناءً على المستوطنات والمناطق المغلقة)
    if(layers.polys["Settlements"]) {
        L.geoJson(layers.polys["Settlements"].toGeoJSON(), {
            style: { color: "red", fillColor: "red", fillOpacity: 0.4 }
        }).addTo(analysisGroup);
    }

    // 2. تحليل المناطق الواعدة (تقاطع الزراعة مع الحرارة)
    if (layers.polys["Agricultural Land"] && layers.polys["Temperature Zones"]) {
        let agriData = layers.polys["Agricultural Land"].toGeoJSON();
        let tempData = layers.polys["Temperature Zones"].toGeoJSON();
        let successZones = [];

        agriData.features.forEach(land => {
            if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                tempData.features.forEach(temp => {
                    if (temp.properties.MEAN_ANNUA === "19 - 21") {
                        let intersect = turf.intersect(land, temp);
                        if (intersect) successZones.push(intersect);
                    }
                });
            }
        });

        if (successZones.length > 0) {
            L.geoJson(turf.featureCollection(successZones), {
                style: { color: "gold", fillColor: "gold", fillOpacity: 0.7, weight: 3 }
            }).bindPopup("<b>منطقة مرشحة للاستثمار</b>").addTo(analysisGroup);
        }
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers(); // هذا سيمسح فقط اللون الأحمر والذهبي ويبقي الطبقات الأصلية
}

// تحميل الطبقات مع الحفاظ على أسمائها البرمجية
loadLayer("Settlements.geojson", "Settlements", "polys", { color:"#ff6666", fillOpacity:0.3 });
loadLayer("Agricultural_Land.geojson", "Agricultural Land", "polys", { color:"green", fillOpacity:0.2 });
loadLayer("Temperature.geojson", "Temperature Zones", "polys", { color:"blue", fillOpacity:0.2 });
loadLayer("Roads.geojson", "Roads", "lines", { color:"black", weight:1 });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", { color:"orange", fillOpacity:0.3 });
loadLayer("Ramallah.geojson", "Ramallah Boundary", "polys", { color:"black", weight:2, fillOpacity:0 });

// التحكم بالشفافية
document.getElementById("opacity-slider").oninput = function () {
    let selected = document.getElementById("opacity-select").value;
    for (let g in layers) { if (layers[g][selected]) layers[g][selected].setStyle({fillOpacity: this.value, opacity: this.value}); }
};
</script>
</body>
</html>
