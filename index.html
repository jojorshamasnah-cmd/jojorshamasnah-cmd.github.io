<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Investment Advisor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; }

        #advisor-control {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .btn-advisor {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-clear { background: #95a5a6; }
        .btn-advisor:hover { background: #e67e22; }

        #legend-box {
            position: absolute;
            bottom: 45px;
            left: 10px;
            background: white;
            padding: 10px 14px;
            border-radius: 10px;
            width: 230px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 9998;
        }

        #legend-content { display: block; margin-top: 8px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .symbol-poly { width: 22px; height: 12px; border: 1px solid #000; margin-right: 6px; }
    </style>
</head>

<body>

<div id="advisor-control">
    <button class="btn-advisor" onclick="runSmartAdvisor()">🧠 تشغيل تحليل الاستثمار</button>
    <button class="btn-advisor btn-clear" onclick="clearAnalysis()">🧹 مسح التحليل</button>
</div>

<div id="map"></div>

<div id="legend-box">
    <div style="font-weight: bold; text-align: center;">دليل المستشار الذكي</div>
    <div id="legend-content">
        <div class="legend-item"><span class="symbol-poly" style="background:gold"></span> مناطق واعدة (حرارة + تربة)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:red; opacity: 0.6;"></span> مناطق استبعاد (مستوطنات/إغلاق)</div>
        <hr>
        <div class="legend-item"><b>المعايير:</b></div>
        <div class="legend-item">✅ أراضي زراعية عالية القيمة</div>
        <div class="legend-item">✅ حرارة (19 - 21) مئوية</div>
        <div class="legend-item">❌ تجنب المناطق المغلقة والمستوطنات</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = { points: {}, lines: {}, polys: {} };
var analysisGroup = L.layerGroup().addTo(map);

function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function (data) {
        var layer = L.geoJson(data, { style: styleObj }).addTo(map);
        layers[group][name] = layer;
    });
}

// --- ANALYSIS LOGIC ---
function runSmartAdvisor() {
    clearAnalysis();
    
    // 1. تحديد المناطق الحمراء (الاستبعاد)
    // نجمع المستوطنات والمناطق المغلقة والمباني في طبقة واحدة حمراء
    let redZones = [];
    if(layers.polys["Settlements"]) redZones.push(layers.polys["Settlements"].toGeoJSON());
    if(layers.polys["Closed Areas"]) redZones.push(layers.polys["Closed Areas"].toGeoJSON());
    if(layers.polys["Built-up Areas"]) redZones.push(layers.polys["Built-up Areas"].toGeoJSON());

    redZones.forEach(geoData => {
        L.geoJson(geoData, {
            style: { color: "red", fillColor: "red", fillOpacity: 0.5, weight: 1 }
        }).addTo(analysisGroup);
    });

    // 2. تحديد المناطق الذهبية (الواعدة)
    if (layers.polys["Agricultural Land"] && layers.polys["Temperature Zones"]) {
        let agriData = layers.polys["Agricultural Land"].toGeoJSON();
        let tempData = layers.polys["Temperature Zones"].toGeoJSON();
        let successZones = [];

        agriData.features.forEach(land => {
            // شرط: أراضي عالية القيمة
            if (land.properties.Agricult_1 && land.properties.Agricult_1.includes("High")) {
                tempData.features.forEach(temp => {
                    // شرط: حرارة مثالية
                    if (temp.properties.MEAN_ANNUA === "19 - 21") {
                        let intersect = turf.intersect(land, temp);
                        if (intersect) successZones.push(intersect);
                    }
                });
            }
        });

        if (successZones.length > 0) {
            L.geoJson(turf.featureCollection(successZones), {
                style: { color: "gold", fillColor: "gold", fillOpacity: 0.8, weight: 2 }
            }).bindPopup("<b>منطقة استثمارية واعدة</b>").addTo(analysisGroup);
        }
    }
    
    alert("تم تحليل الخريطة: اللون الذهبي للمناطق الواعدة، والأحمر لمناطق الاستبعاد.");
}

function clearAnalysis() {
    analysisGroup.clearLayers();
}

// --- LOAD DATA ---
loadLayer("Settlements.geojson", "Settlements", "polys", { color:"#ff6666", fillOpacity:0.2 });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", { color:"orange", fillOpacity:0.2 });
loadLayer("Built_up.geojson", "Built-up Areas", "polys", { color:"brown", fillOpacity:0.2 });
loadLayer("Agricultural_Land.geojson", "Agricultural Land", "polys", { color:"green", fillOpacity:0.1 });
loadLayer("Temperature.geojson", "Temperature Zones", "polys", { color:"blue", fillOpacity:0.1 });
loadLayer("Ramallah.geojson", "Ramallah Boundary", "polys", { color:"black", weight:2, fillOpacity:0 });

</script>
</body>
</html>
