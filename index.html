<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Professional Suite</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; }
        #advisor-ui { position: absolute; top: 10px; left: 50px; z-index: 1000; display: flex; gap: 5px; }
        
        .btn-tool {
            background: #2c3e50; color: white; border: none; padding: 10px 15px;
            border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-hazard { background: #d35400; }
        .btn-clear { background: #95a5a6; }
        .btn-tool:hover { opacity: 0.9; }

        /* تنسيق الليجند المحسن */
        #legend-box {
            position: absolute; bottom: 30px; left: 10px; background: white;
            padding: 0; border-radius: 12px; width: 260px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9998;
            overflow: hidden; border: 1px solid #ddd;
        }
        
        #legend-title { 
            font-weight: bold; text-align: center; cursor: pointer; 
            background: #f8f9fa; padding: 12px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }

        #legend-content { padding: 12px; max-height: 400px; overflow-y: auto; display: block; }

        .legend-section-title { font-size: 13px; font-weight: bold; color: #2c3e50; margin: 8px 0 4px 0; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 12px; }
        .symbol-poly { width: 18px; height: 10px; border: 1px solid #555; margin-right: 8px; }
        .symbol-line { width: 25px; height: 3px; margin-right: 8px; }
        
        #opacity-box { position: absolute; right: 10px; bottom: 45px; background: white; padding: 12px; border-radius: 10px; width: 220px; box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 9999; }
        select, input[type=range] { width: 100%; margin-top: 6px; }
    </style>
</head>

<body>

<div id="advisor-ui">
    <button class="btn-tool" onclick="runSmartAdvisor()">🧠 Smart Advisor</button>
    <button class="btn-tool btn-hazard" onclick="runHazardScanner()">⚠️ Hazard Scanner</button>
    <button class="btn-tool btn-clear" onclick="clearAnalysis()">🧹 Clear</button>
</div>

<div id="map"></div>

<div id="opacity-box">
    <div style="font-weight:bold; text-align:center;">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title" onclick="toggleLegend()">
        <span>🗺️ Map Legend</span>
        <span id="legend-arrow">▲</span>
    </div>
    <div id="legend-content">
        <div id="analysis-legend">
            <div class="legend-section-title">Active Analysis:</div>
            <div id="legend-items-dynamic" style="font-style: italic; color: #7f8c8d;">No analysis running...</div>
        </div>
        <hr style="border:0; border-top:1px solid #eee; margin: 10px 0;">
        <div class="legend-section-title">Static Layers:</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#ff6666"></span> Settlements</div>
        <div class="legend-item"><span class="symbol-line" style="background:#3498db"></span> Streams (Wadis)</div>
        <div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = { points: {}, lines: {}, polys: {} };
var analysisGroup = L.layerGroup().addTo(map);
var control = L.control.layers({}, {}, { collapsed: false }).addTo(map);

// وظيفة فتح وإغلاق الليجند
function toggleLegend() {
    var content = document.getElementById("legend-content");
    var arrow = document.getElementById("legend-arrow");
    if (content.style.display === "none") {
        content.style.display = "block";
        arrow.innerHTML = "▲";
    } else {
        content.style.display = "none";
        arrow.innerHTML = "▼";
    }
}

function getPointIcon(type) {
    let icon = type === "Schools" ? "🏫" : type === "Wells" ? "💧" : type === "Quarries" ? "⛏️" : "•";
    return L.divIcon({ html: icon, className: "", iconSize: [25, 25], iconAnchor: [12, 12] });
}

function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function (data) {
        var layer;
        if (group === "points") {
            layer = L.geoJson(data, {
                pointToLayer: function (f, l) { return L.marker(l, { icon: getPointIcon(name) }); }
            }).addTo(map);
        } else {
            layer = L.geoJson(data, { style: styleObj }).addTo(map);
        }
        layers[group][name] = layer;
        control.addOverlay(layer, name);
        document.getElementById("opacity-select").innerHTML += `<option value="${name}">${name}</option>`;
    });
}

function runSmartAdvisor() {
    clearAnalysis();
    document.getElementById("legend-items-dynamic").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#2ecc71"></span> High Potential</div>
        <div class="legend-item"><span class="symbol-poly" style="background:red"></span> Exclusion Zone</div>
    `;
    // ... منطق التحليل ...
}

function runHazardScanner() {
    clearAnalysis();
    document.getElementById("legend-items-dynamic").innerHTML = `
        <div class="legend-item"><span class="symbol-poly" style="background:#c0392b"></span> Flood Risk (150m)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e67e22"></span> Quarry Impact</div>
    `;
    
    if (layers.lines["Streams"]) {
        let streamJSON = layers.lines["Streams"].toGeoJSON();
        let streamBuffer = turf.buffer(streamJSON, 0.15, { units: 'kilometers' });
        L.geoJson(streamBuffer, {
            style: { color: "#c0392b", fillColor: "#e74c3c", fillOpacity: 0.5, weight: 1 }
        }).addTo(analysisGroup);
    }
    
    if (layers.points["Quarries"]) {
        let quarryJSON = layers.points["Quarries"].toGeoJSON();
        let quarryBuffer = turf.buffer(quarryJSON, 0.5, { units: 'kilometers' });
        L.geoJson(quarryBuffer, {
            style: { color: "#d35400", fillColor: "#e67e22", fillOpacity: 0.4, weight: 1 }
        }).addTo(analysisGroup);
    }
}

function clearAnalysis() {
    analysisGroup.clearLayers();
    document.getElementById("legend-items-dynamic").innerHTML = "No analysis running...";
}

// تحميل الطبقات
loadLayer("Schools.geojson", "Schools", "points");
loadLayer("Wells.geojson", "Wells", "points");
loadLayer("Quarries.geojson", "Quarries", "points");
loadLayer("Roads.geojson", "Roads", "lines", { color:"black", weight:1.5 });
loadLayer("Streams.geojson", "Streams", "lines", { color:"#3498db", weight:1.5 });
loadLayer("Annexation_Wall.geojson", "Annexation Wall", "lines", { color:"#555", weight:2 });
loadLayer("Agricultural_Land.geojson", "Agricultural Land", "polys", { color:"#2dcc71", fillOpacity:0.3 });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", { color:"orange", fillOpacity:0.3 });
loadLayer("Built_up.geojson", "Built-up Areas", "polys", { color:"brown", fillOpacity:0.3 });
loadLayer("Approved_Urban_Master_Plans_super_simplified.geojson", "Master Plans", "polys", { color:"purple", fillOpacity:0.3 });
loadLayer("Settlements.geojson", "Settlements", "polys", { color:"red", fillOpacity:0.3 });
loadLayer("Temperature.geojson", "Temperature Zones", "polys", { color:"blue", fillOpacity:0.1 });
loadLayer("Ramallah.geojson", "Ramallah Boundary", "polys", { color:"black", weight:2, fillOpacity:0 });

document.getElementById("opacity-slider").oninput = function () {
    let s = document.getElementById("opacity-select").value;
    for (let g in layers) { if (layers[g][s]) layers[g][s].setStyle({ opacity: this.value, fillOpacity: this.value }); }
};
</script>
</body>
</html>
