<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map{height:100vh;}

#legend-box{position:absolute;bottom:45px;left:10px;background:white;padding:10px 14px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9998;}
#legend-title{font-weight:bold;text-align:center;font-size:16px;cursor:pointer;}
#legend-content{display:none;margin-top:8px;font-size:14px;}
.legend-item{display:flex;align-items:center;margin-bottom:5px;}
.emoji{font-size:20px;width:25px;margin-right:6px;}
.symbol-line{width:30px;height:4px;margin-right:6px;}
.symbol-poly{width:22px;height:12px;border:1px solid #000;margin-right:6px;}

#opacity-box{position:absolute;right:10px;bottom:45px;background:white;padding:12px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9999;}
#opacity-title{text-align:center;font-weight:bold;}
select,input[type=range]{width:100%;}

.leaflet-control-scale{left:50%!important;transform:translateX(-50%);bottom:5px!important;}

#advisor-box{
position:absolute;
right:10px;
bottom:220px;
background:white;
padding:8px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
z-index:9999;
width:220px;
font-family:Arial;
}
#advisor-box button{width:100%;margin-top:5px;}
</style>
</head>

<body>
<div id="map"></div>

<div id="opacity-box">
<div id="opacity-title">Layer Opacity</div>
<select id="opacity-select"><option disabled selected>Select Layer</option></select>
<input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
<div id="legend-title">Legend ▼</div>
<div id="legend-content">
<div class="legend-item"><span class="emoji">🏫</span> Schools</div>
<div class="legend-item"><span class="emoji">💧</span> Wells</div>
<div class="legend-item"><span class="emoji">⛏️</span> Quarries</div>
<hr>
<div class="legend-item"><span class="symbol-line" style="background:black"></span> Roads</div>
<div class="legend-item"><span class="symbol-line" style="background:#0077ff"></span> Streams</div>
<hr>
<div class="legend-item"><span class="symbol-poly" style="background:#8fd19e"></span> Agricultural Land</div>
<div class="legend-item"><span class="symbol-poly" style="background:#87ceeb"></span> Temperature Zones</div>
</div>
</div>

<div id="advisor-box">
<button onclick="runSmartAdvisor()">📊 Smart Investment Advisor</button>
<button onclick="runMunicipalRiskScanner()">⚠️ Municipal Risk Scanner</button>
<button onclick="generatePDF()">📄 Export PDF</button>
</div>

<script>
var map=L.map("map").setView([31.903,35.203],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({imperial:false}).addTo(map);

var layers={points:{},lines:{},polys:{}};
var control=L.control.layers({}, {}, {collapsed:false}).addTo(map);

function loadLayer(file,name,group,style){
$.getJSON(file,function(data){
let layer = group==="points"
? L.geoJson(data,{pointToLayer:(f,ll)=>L.marker(ll)}).addTo(map)
: L.geoJson(data,{style:style}).addTo(map);
layers[group][name]=layer;
control.addOverlay(layer,name);
opacitySelect.innerHTML+=`<option>${name}</option>`;
});
}

loadLayer("Agricultural_Land.geojson","Agricultural Land","polys",{fillColor:"#8fd19e",fillOpacity:0.6});
loadLayer("Temperature.geojson","Temperature Zones","polys",{fillColor:"#87ceeb",fillOpacity:0.6});
loadLayer("Quarries.geojson","Quarries","points");
loadLayer("Streams.geojson","Streams","lines",{color:"#0077ff"});

var investmentLayer;
function runSmartAdvisor(){
let agri=layers.polys["Agricultural Land"].toGeoJSON();
let temp=layers.polys["Temperature Zones"].toGeoJSON();
agri.features.forEach(f=>{
let score=0;
temp.features.forEach(t=>{ if(turf.booleanIntersects(f,t)) score+=2; });
f.properties.level=score>=2?"High":"Low";
});
investmentLayer=L.geoJson(agri,{
style:f=>({fillColor:f.properties.level==="High"?"#2ecc71":"#e74c3c",fillOpacity:0.7}),
onEachFeature:(f,l)=>l.bindPopup("Investment: "+f.properties.level)
}).addTo(map);
control.addOverlay(investmentLayer,"Smart Investment Zones");
}

var municipalRiskLayer;
function runMunicipalRiskScanner(){
let agri=layers.polys["Agricultural Land"].toGeoJSON();
let temp=layers.polys["Temperature Zones"].toGeoJSON();
let quarries=layers.points["Quarries"].toGeoJSON();
let streams=layers.lines["Streams"].toGeoJSON();

let qBuf=turf.buffer(quarries,0.6,{units:"kilometers"});
let fBuf=turf.buffer(streams,0.4,{units:"kilometers"});

agri.features.forEach(f=>{
let r=0;
temp.features.forEach(t=>{ if(turf.booleanIntersects(f,t)) r+=2; });
if(turf.booleanIntersects(f,qBuf)) r+=2;
if(turf.booleanIntersects(f,fBuf)) r+=1;
f.properties.risk=r>=4?"High":r>=2?"Medium":"Low";
});

municipalRiskLayer=L.geoJson(agri,{
style:f=>({fillColor:f.properties.risk==="High"?"#e74c3c":f.properties.risk==="Medium"?"#f1c40f":"#2ecc71",fillOpacity:0.7}),
onEachFeature:(f,l)=>l.bindPopup("Municipal Risk: "+f.properties.risk)
}).addTo(map);

control.addOverlay(municipalRiskLayer,"Municipal Risk Zones");
}
</script>
</body>
</html>
