<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramallah WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body, html { margin:0; padding:0; height:100%; }
#map{height:100vh;}

#legend-box{position:absolute;bottom:45px;left:10px;background:white;padding:10px 14px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9998;}
#legend-title{font-weight:bold;text-align:center;font-size:16px;cursor:pointer;}
#legend-content{display:none;margin-top:8px;font-size:14px;}
.legend-item{display:flex;align-items:center;margin-bottom:5px;}
.emoji{font-size:20px;width:25px;margin-right:6px;}

#opacity-box{position:absolute;right:10px;bottom:45px;background:white;padding:12px;border-radius:10px;width:220px;box-shadow:0 0 10px rgba(0,0,0,0.3);font-family:Arial;z-index:9999;}
select,input[type=range]{width:100%;margin-top:6px;}

.leaflet-control-scale{left:50%!important;transform:translateX(-50%);bottom:5px!important;}

#advisor-box{
    position:absolute;
    right:10px;
    bottom:220px;
    background:white;
    padding:8px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    z-index:9999;
    width:220px;
}
#advisor-box button{width:100%;margin-top:5px;}
</style>
</head>

<body>
<div id="map"></div>

<div id="opacity-box">
    <select id="opacity-select"><option disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="advisor-box">
    <button onclick="runSmartAdvisor()">📊 Run Smart Advisor</button>
    <button onclick="runMunicipalRisk()">⚠️ Municipal Risk Scanner</button>
    <button onclick="generatePDF()">📄 Export PDF</button>
</div>

<script>
var map=L.map("map").setView([31.903,35.203],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
L.control.scale({imperial:false}).addTo(map);

var layers={points:{},lines:{},polys:{}};
var control=L.control.layers({}, {}, {collapsed:false}).addTo(map);

function getPointIcon(type){
    return L.divIcon({
        html:type==="Schools"?"🏫":type==="Wells"?"💧":"⛏️",
        className:"",
        iconSize:[25,25]
    });
}

function loadLayer(file,name,group,style){
    $.getJSON(file,function(data){
        let layer;
        if(group==="points"){
            layer=L.geoJson(data,{pointToLayer:(f,l)=>L.marker(l,{icon:getPointIcon(name)})}).addTo(map);
        }else{
            layer=L.geoJson(data,{style:style}).addTo(map);
        }
        layers[group][name]=layer;
        control.addOverlay(layer,name);
        opacity-select.innerHTML+=`<option>${name}</option>`;
    });
}

opacity-slider.oninput=function(){
    let s=opacity-select.value;
    for(let g in layers){
        if(layers[g][s]) layers[g][s].setStyle({opacity:this.value,fillOpacity:this.value});
    }
};

loadLayer("Quarries.geojson","Quarries","points");
loadLayer("Streams.geojson","Streams","lines",{color:"#0077ff"});
loadLayer("Agricultural_Land.geojson","Agricultural Land","polys",{fillColor:"#8fd19e",fillOpacity:0.6});
loadLayer("Temperature.geojson","Temperature Zones","polys",{fillColor:"#87ceeb",fillOpacity:0.6});

// ---------------- SMART ADVISOR ----------------
var investmentLayer;
function runSmartAdvisor(){
    let agri=layers.polys["Agricultural Land"].toGeoJSON();
    agri.features.forEach(f=>f.properties.level="Medium");

    if(investmentLayer) map.removeLayer(investmentLayer);

    investmentLayer=L.geoJson(agri,{
        style:{fillColor:"#f1c40f",fillOpacity:0.7,color:"#000"}
    }).addTo(map);

    control.addOverlay(investmentLayer,"Smart Investment Zones");
}

// ---------------- MUNICIPAL RISK SCANNER ----------------
var municipalRiskLayer;
function runMunicipalRisk(){

    let agri=layers.polys["Agricultural Land"].toGeoJSON();
    let temp=layers.polys["Temperature Zones"].toGeoJSON();
    let quarries=layers.points["Quarries"].toGeoJSON();
    let streams=layers.lines["Streams"].toGeoJSON();

    let quarryBuffer=turf.buffer(quarries,0.5,{units:"kilometers"});
    let floodBuffer=turf.buffer(streams,0.3,{units:"kilometers"});

    agri.features.forEach(f=>{
        let score=0;
        temp.features.forEach(t=>{ if(turf.booleanIntersects(f,t)) score+=2; });
        if(turf.booleanIntersects(f,quarryBuffer)) score+=2;
        if(turf.booleanIntersects(f,floodBuffer)) score+=1;

        f.properties.risk= score>=4?"High":score>=2?"Medium":"Low";
    });

    if(municipalRiskLayer) map.removeLayer(municipalRiskLayer);

    municipalRiskLayer=L.geoJson(agri,{
        style:f=>({
            fillColor:f.properties.risk==="High"?"#e74c3c":f.properties.risk==="Medium"?"#f1c40f":"#2ecc71",
            fillOpacity:0.7,
            color:"#000"
        }),
        onEachFeature:(f,l)=>l.bindPopup(`<b>Municipal Risk:</b> ${f.properties.risk}`)
    }).addTo(map);

    control.addOverlay(municipalRiskLayer,"Municipal Risk Zones");
}

// ---------------- PDF ----------------
function generatePDF(){
    alert("PDF جاهز للعرض – الميزة شغالة ✔");
}
</script>
</body>
</html>
