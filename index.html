<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramallah WebGIS - Smart Advisor</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; }

        #advisor-ui {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            display: flex;
            gap: 5px;
        }

        .btn-advisor {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-clear { background: #95a5a6; }
        .btn-advisor:hover { opacity: 0.9; }

        #legend-box {
            position: absolute;
            bottom: 45px;
            left: 10px;
            background: white;
            padding: 10px 14px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 9998;
        }

        #legend-title { font-weight: bold; text-align: center; cursor: pointer; }
        #legend-content { display: none; margin-top: 8px; font-size: 14px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .symbol-poly { width: 22px; height: 12px; border: 1px solid #000; margin-right: 6px; }

        #opacity-box {
            position: absolute;
            right: 10px;
            bottom: 45px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            width: 220px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 9999;
        }

        select, input[type=range] { width: 100%; margin-top: 6px; }
    </style>
</head>

<body>

<div id="advisor-ui">
    <button class="btn-advisor" onclick="runSmartAdvisor()">🧠 Smart Advisor</button>
    <button class="btn-advisor btn-clear" onclick="clearAnalysis()">🧹 Clear Analysis</button>
</div>

<div id="map"></div>

<div id="opacity-box">
    <div style="font-weight:bold; text-align:center;">Layer Opacity</div>
    <select id="opacity-select"><option value="" disabled selected>Select Layer</option></select>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.1" value="1">
</div>

<div id="legend-box">
    <div id="legend-title">Legend ▼</div>
    <div id="legend-content">
        <div class="legend-item"><span class="symbol-poly" style="background:#27ae60"></span> High Potential (Green)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#f1c40f"></span> Moderate Potential (Yellow)</div>
        <div class="legend-item"><span class="symbol-poly" style="background:#e74c3c"></span> Exclusion Zones (Red)</div>
        <hr>
        <div id="dynamic-layers-legend"></div>
    </div>
</div>

<script>
var map = L.map("map").setView([31.903, 35.203], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

var layers = { points: {}, lines: {}, polys: {} };
var analysisGroup = L.layerGroup().addTo(map); 
var control = L.control.layers({}, {}, { collapsed: false }).addTo(map);

function getPointIcon(type) {
    let emoji = type === "Schools" ? "🏫" : type === "Wells" ? "💧" : type === "Quarries" ? "⛏️" : "📍";
    return L.divIcon({ html: emoji, className: "", iconSize: [25, 25], iconAnchor: [12, 12] });
}

function loadLayer(file, name, group, styleObj) {
    $.getJSON(file, function (data) {
        var layer;
        if (group === "points") {
            layer = L.geoJson(data, {
                pointToLayer: function (f, l) { return L.marker(l, { icon: getPointIcon(name) }); }
            }).addTo(map);
        } else {
            layer = L.geoJson(data, { style: styleObj }).addTo(map);
        }
        layers[group][name] = layer;
        control.addOverlay(layer, name);
        document.getElementById("opacity-select").innerHTML += `<option value="${name}">${name}</option>`;
    });
}

function runSmartAdvisor() {
    clearAnalysis();
    
    // 1. RED: Exclusion Zones
    if (layers.polys["Settlements"]) {
        L.geoJson(layers.polys["Settlements"].toGeoJSON(), {
            style: { color: "#e74c3c", fillColor: "#e74c3c", fillOpacity: 0.6, weight: 1 }
        }).bindPopup("<b>Exclusion Zone</b><br>Settlement Area: Investment Forbidden.")
          .addTo(analysisGroup);
    }
    
    if (layers.polys["Closed Areas"]) {
        L.geoJson(layers.polys["Closed Areas"].toGeoJSON(), {
            style: { color: "#c0392b", fillColor: "#c0392b", fillOpacity: 0.5, weight: 1 }
        }).bindPopup("<b>Exclusion Zone</b><br>Military Zone: Access Restricted.")
          .addTo(analysisGroup);
    }

    // 2. GREEN & YELLOW: Potential Analysis
    if (layers.polys["Agricultural Land"] && layers.polys["Temperature Zones"]) {
        let agri = layers.polys["Agricultural Land"].toGeoJSON();
        let temp = layers.polys["Temperature Zones"].toGeoJSON();
        let highPot = [];
        let modPot = [];

        agri.features.forEach(land => {
            let isHighAgri = land.properties.Agricult_1 && land.properties.Agricult_1.includes("High");
            
            temp.features.forEach(t => {
                let isIdealTemp = t.properties.MEAN_ANNUA === "19 - 21";
                let intersect = turf.intersect(land, t);
                
                if (intersect) {
                    if (isHighAgri && isIdealTemp) {
                        highPot.push(intersect); // Green
                    } else if (isHighAgri || isIdealTemp) {
                        modPot.push(intersect); // Yellow
                    }
                }
            });
        });

        // Display Green Results
        if (highPot.length > 0) {
            L.geoJson(turf.featureCollection(highPot), {
                style: { color: "#27ae60", fillColor: "#2ecc71", fillOpacity: 0.8, weight: 2 }
            }).bindPopup("<b>Best Choice (Green)</b><br>Optimal soil and climate conditions.")
              .addTo(analysisGroup);
        }

        // Display Yellow Results
        if (modPot.length > 0) {
            L.geoJson(turf.featureCollection(modPot), {
                style: { color: "#f1c40f", fillColor: "#fbc531", fillOpacity: 0.6, weight: 2 }
            }).bindPopup("<b>Moderate Choice (Yellow)</b><br>Good conditions, but check details.")
              .addTo(analysisGroup);
        }
    }
    alert("Smart Analysis Applied: Green (High), Yellow (Moderate), Red (Exclusion).");
}

function clearAnalysis() {
    analysisGroup.clearLayers();
}

// --- Loading Layers ---
loadLayer("Schools.geojson", "Schools", "points");
loadLayer("Wells.geojson", "Wells", "points");
loadLayer("Quarries.geojson", "Quarries", "points");
loadLayer("Roads.geojson", "Roads", "lines", { color:"black", weight:1.5 });
loadLayer("Streams.geojson", "Streams", "lines", { color:"#3498db", weight:1.5 });
loadLayer("Agricultural_Land.geojson", "Agricultural Land", "polys", { color:"#2dcc71", fillColor:"#8fd19e", fillOpacity:0.4 });
loadLayer("Areas_totaly_closed_by_the_wall.geojson", "Closed Areas", "polys", { color:"#e67e22", fillColor:"#ffb347", fillOpacity:0.4 });
loadLayer("Settlements.geojson", "Settlements", "polys", { color:"#e74c3c", fillColor:"#ff6666", fillOpacity:0.4 });
loadLayer("Temperature.geojson", "Temperature Zones", "polys", { color:"#3498db", fillColor:"#87ceeb", fillOpacity:0.3 });
loadLayer("Ramallah.geojson", "Ramallah Boundary", "polys", { color:"#2c3e50", weight:2, fillOpacity:0 });

// Controls
document.getElementById("opacity-slider").oninput = function () {
    let s = document.getElementById("opacity-select").value;
    for (let g in layers) { if (layers[g][s]) layers[g][s].setStyle({ opacity: this.value, fillOpacity: this.value }); }
};

document.getElementById("legend-title").onclick = function () {
    let c = document.getElementById("legend-content");
    c.style.display = c.style.display === "none" ? "block" : "none";
    this.innerHTML = c.style.display === "none" ? "Legend ▼" : "Legend ▲";
};
</script>
</body>
</html>
